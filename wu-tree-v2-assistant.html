<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .phone-frame {
            width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        /* Pétales */
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        /* Nuages */
        .cloud { position: absolute; color: white; font-size: 40px; opacity: 0.5;
            animation: float-cloud linear infinite; pointer-events: none; z-index: 40; }
        .cloud:nth-child(6) { top: 80px; animation-duration: 180s; }
        .cloud:nth-child(7) { top: 200px; animation-duration: 220s; animation-delay: -60s; font-size: 30px; }
        @keyframes float-cloud { 0% { transform: translateX(-80px); } 100% { transform: translateX(455px); } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        .content {
            position: absolute; top: 44px; left: 0; right: 0; bottom: 70px;
            display: flex; flex-direction: column;
            z-index: 60; overflow: hidden;
        }
        
        /* Mascotte */
        .mascot-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        
        .mascot {
            position: relative; width: 120px; height: 140px;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .mascot-tree {
            font-size: 80px; text-align: center;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.1));
        }
        
        .mascot-eyes {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 12px;
        }
        
        .eye {
            width: 14px; height: 14px;
            background: #333; border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }
        
        .eye::after {
            content: ''; position: absolute;
            top: 2px; left: 3px;
            width: 5px; height: 5px;
            background: white; border-radius: 50%;
        }
        
        @keyframes blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }
        
        .mascot-mouth {
            position: absolute; top: 45px; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 10px;
            border: 3px solid #333;
            border-top: none;
            border-radius: 0 0 20px 20px;
        }
        
        /* Conversation */
        .conversation {
            flex: 1; overflow-y: auto;
            padding: 0 20px; margin-bottom: 10px;
            display: flex; flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 85%; padding: 12px 16px;
            border-radius: 18px; font-size: 14px;
            line-height: 1.5; animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            color: #333;
            border: 1px solid rgba(255,255,255,0.6);
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #98D89E 0%, #4CAF50 100%);
            color: white;
        }
        
        .message.thinking {
            align-self: flex-start;
            background: rgba(255,255,255,0.3);
            color: #666;
        }
        
        .typing-dots {
            display: flex; gap: 4px;
        }
        
        .typing-dots span {
            width: 8px; height: 8px;
            background: #666; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        /* Input area */
        .input-area {
            padding: 10px 15px 15px;
            display: flex; gap: 10px; align-items: center;
        }
        
        .text-input {
            flex: 1; padding: 12px 16px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 24px; font-size: 14px;
            font-family: 'Comfortaa', sans-serif;
            color: #333; outline: none;
            transition: all 0.3s;
        }
        
        .text-input:focus {
            border-color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.7);
        }
        
        .text-input::placeholder { color: rgba(0,0,0,0.4); }
        
        .mic-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            border: 2px solid rgba(255,255,255,0.6);
            color: white; font-size: 20px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s;
        }
        
        .mic-btn:active { transform: scale(0.95); }
        
        .mic-btn.listening {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, #FF1493 0%, #C71585 100%);
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 20, 147, 0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255, 20, 147, 0); }
        }
        
        .send-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #98D89E 0%, #4CAF50 100%);
            border: 2px solid rgba(255,255,255,0.6);
            color: white; font-size: 18px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.3s;
        }
        
        .send-btn:active { transform: scale(0.95); }
        
        /* Action buttons (suggestions rapides) */
        .quick-actions {
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: center; padding: 0 20px 10px;
        }
        
        .quick-btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 12px; color: #555;
            cursor: pointer; transition: all 0.2s;
        }
        
        .quick-btn:active {
            background: rgba(255,255,255,0.7);
            transform: scale(0.97);
        }
        
        /* Bottom menu */
        .bottom-menu { position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 90; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 8px 16px; border-radius: 12px; transition: all 0.3s; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(74, 90, 79, 0.8); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="content">
            <div class="mascot-container" id="mascotContainer">
                <div class="mascot">
                    <div class="mascot-tree">🌳</div>
                    <div class="mascot-eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mascot-mouth"></div>
                </div>
            </div>
            
            <div class="conversation" id="conversation"></div>
            
            <div class="quick-actions" id="quickActions">
                <button class="quick-btn" onclick="sendQuick('Nouvelle habitude')">🌱 Nouvelle habitude</button>
                <button class="quick-btn" onclick="sendQuick('Mes stats')">📊 Mes stats</button>
                <button class="quick-btn" onclick="sendQuick('Cohérence cardiaque')">🫀 Respirer</button>
            </div>
            
            <div class="input-area">
                <input type="text" class="text-input" id="textInput" placeholder="Écris ou parle..." 
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤</button>
                <button class="send-btn" onclick="sendMessage()">→</button>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToWellbeing()"><div class="menu-icon">✨</div><div class="menu-label">Bien-être</div></div>
            <div class="menu-item active"><div class="menu-icon">🌳</div><div class="menu-label">Assistant</div></div>
            <div class="menu-item" onclick="goToOrganisation()"><div class="menu-icon">📋</div><div class="menu-label">Organisation</div></div>
        </div>
    </div>
    
    <script>
        // State
        let isListening = false;
        let recognition = null;
        let conversationHistory = [];
        
        // System prompt pour l'IA
        const SYSTEM_PROMPT = `Tu es l'assistant bienveillant de Wu Tree, une application de bien-être et d'organisation personnelle.

Ton rôle :
- Aider l'utilisateur à créer des habitudes et objectifs de manière simple
- Utiliser la philosophie Kaizen (petits pas) et Wu Wei (non-forçage)
- Être doux, encourageant, jamais culpabilisant
- Répondre de manière concise (2-3 phrases max)

Quand l'utilisateur veut créer une habitude :
1. Reformule ce qu'il veut accomplir
2. Propose un premier petit pas (Kaizen)
3. Demande confirmation

Exemples de réponses :
- "Super idée ! Et si on commençait doucement, avec juste 30 secondes de douche froide à la fin ?"
- "La méditation, c'est puissant. 2 minutes par jour pour commencer ?"

Tu parles en français, de manière chaleureuse et simple.`;

        // Init Speech Recognition
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('textInput').value = text;
                    sendMessage();
                };
                
                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('micBtn').classList.remove('listening');
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech error:', event.error);
                    isListening = false;
                    document.getElementById('micBtn').classList.remove('listening');
                };
            }
        }
        
        function toggleListening() {
            if (!recognition) {
                addMessage("La reconnaissance vocale n'est pas disponible sur ce navigateur.", 'assistant');
                return;
            }
            
            if (isListening) {
                recognition.stop();
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
            } else {
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
            }
        }
        
        function addMessage(text, type) {
            const conversation = document.getElementById('conversation');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            conversation.appendChild(msg);
            conversation.scrollTop = conversation.scrollHeight;
            
            // Shrink mascot when conversation starts
            const mascotContainer = document.getElementById('mascotContainer');
            mascotContainer.style.flex = '0';
            mascotContainer.style.padding = '15px';
            mascotContainer.querySelector('.mascot').style.transform = 'scale(0.6)';
        }
        
        function showThinking() {
            const conversation = document.getElementById('conversation');
            const msg = document.createElement('div');
            msg.className = 'message thinking';
            msg.id = 'thinkingMsg';
            msg.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            conversation.appendChild(msg);
            conversation.scrollTop = conversation.scrollHeight;
        }
        
        function removeThinking() {
            const thinking = document.getElementById('thinkingMsg');
            if (thinking) thinking.remove();
        }
        
        async function sendMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            addMessage(text, 'user');
            
            // Hide quick actions after first message
            document.getElementById('quickActions').style.display = 'none';
            
            // Add to history
            conversationHistory.push({ role: 'user', content: text });
            
            showThinking();
            
            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 300,
                        system: SYSTEM_PROMPT,
                        messages: conversationHistory
                    })
                });
                
                const data = await response.json();
                removeThinking();
                
                if (data.content && data.content[0]) {
                    const reply = data.content[0].text;
                    conversationHistory.push({ role: 'assistant', content: reply });
                    addMessage(reply, 'assistant');
                    
                    // Check if we should create a habit
                    checkForHabitCreation(text, reply);
                }
            } catch (error) {
                removeThinking();
                addMessage("Oups, je n'ai pas pu répondre. Réessaie !", 'assistant');
                console.error('API Error:', error);
            }
        }
        
        function sendQuick(text) {
            document.getElementById('textInput').value = text;
            sendMessage();
        }
        
        function checkForHabitCreation(userText, assistantReply) {
            // Simple detection - could be improved with AI
            const habitKeywords = ['habitude', 'douche froide', 'méditation', 'sport', 'lecture', 'jeûne'];
            const confirmKeywords = ['oui', 'ok', "d'accord", 'allons-y', 'on y va', 'parfait'];
            
            const isHabitContext = habitKeywords.some(k => 
                userText.toLowerCase().includes(k) || assistantReply.toLowerCase().includes(k)
            );
            
            if (isHabitContext) {
                // Store context for potential habit creation
                localStorage.setItem('wutree_pending_habit', JSON.stringify({
                    context: userText,
                    suggestion: assistantReply,
                    timestamp: Date.now()
                }));
            }
        }
        
        // Initial greeting
        function greet() {
            const hour = new Date().getHours();
            let greeting = "Salut";
            if (hour < 12) greeting = "Bonjour";
            else if (hour < 18) greeting = "Bon après-midi";
            else greeting = "Bonsoir";
            
            const habits = JSON.parse(localStorage.getItem('wutree_habits') || '[]');
            const userName = localStorage.getItem('wutree_username') || '';
            
            let message = `${greeting}${userName ? ' ' + userName : ''} ! 🌿\n\nComment puis-je t'aider aujourd'hui ?`;
            
            if (habits.length > 0) {
                const pendingToday = habits.filter(h => {
                    const today = new Date().toISOString().split('T')[0];
                    return !h.completedDays.includes(today);
                });
                if (pendingToday.length > 0) {
                    message = `${greeting}${userName ? ' ' + userName : ''} ! 🌿\n\nTu as ${pendingToday.length} habitude${pendingToday.length > 1 ? 's' : ''} à valider aujourd'hui. On s'y met ?`;
                }
            }
            
            setTimeout(() => addMessage(message, 'assistant'), 500);
        }
        
        // Navigation
        function goToWellbeing() { window.location.href = 'wu-tree-v2-wellbeing.html'; }
        function goToOrganisation() { window.location.href = 'wu-tree-v2-home.html'; }
        
        // Init
        initSpeechRecognition();
        greet();
    </script>
</body>
</html>
