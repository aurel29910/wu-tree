<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Domaine</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        .cloud {
            position: absolute;
            color: white;
            font-size: 50px;
            opacity: 0.5;
            animation: float-cloud linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .cloud:nth-child(6) { top: 120px; animation-duration: 180s; }
        .cloud:nth-child(7) { top: 250px; animation-duration: 220s; animation-delay: -60s; font-size: 40px; }
        
        @keyframes float-cloud {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(470px); }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 10px 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        
        .back-btn {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #333;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-content { flex: 1; }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-subtitle {
            font-size: 11px;
            color: rgba(0,0,0,0.5);
            margin-top: 3px;
        }
        
        .content {
            padding: 20px;
            height: calc(100% - 190px);
            overflow-y: auto;
            position: relative;
            z-index: 50;
        }
        
        /* Bubbles grid */
        .bubbles-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 10px 0;
        }
        
        .bubble {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1), inset 0 2px 10px rgba(255,255,255,0.4);
            transition: transform 0.3s;
            position: relative;
        }
        
        .bubble:active { transform: scale(0.95); }
        
        .bubble:nth-child(1) { animation: float1 6s ease-in-out infinite; }
        .bubble:nth-child(2) { animation: float2 7s ease-in-out infinite; animation-delay: -1s; }
        .bubble:nth-child(3) { animation: float3 6.5s ease-in-out infinite; animation-delay: -2s; }
        .bubble:nth-child(4) { animation: float1 7.5s ease-in-out infinite; animation-delay: -0.5s; }
        .bubble:nth-child(5) { animation: float2 6.8s ease-in-out infinite; animation-delay: -3s; }
        .bubble:nth-child(6) { animation: float3 7.2s ease-in-out infinite; animation-delay: -1.5s; }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(5px, -8px); }
            50% { transform: translate(-3px, -5px); }
            75% { transform: translate(6px, -10px); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, -6px); }
            50% { transform: translate(4px, -12px); }
            75% { transform: translate(-5px, -4px); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(4px, -10px); }
            50% { transform: translate(-5px, -7px); }
            75% { transform: translate(3px, -5px); }
        }
        
        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 25%; height: 15%;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            filter: blur(3px);
        }
        
        .bubble-emoji { font-size: 32px; margin-bottom: 5px; }
        .bubble-label { font-size: 9px; font-weight: 600; color: #333; text-align: center; max-width: 80px; line-height: 1.2; }
        
        .bubble-badge {
            position: absolute;
            top: 3px; right: 3px;
            min-width: 20px; height: 20px;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border-radius: 10px;
            color: white;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }
        
        .bubble-badge.empty { display: none; }
        
        .bubble.add-bubble {
            background: rgba(255, 255, 255, 0.25);
            border: 3px dashed rgba(255, 255, 255, 0.5);
            animation: none;
        }
        .bubble.add-bubble .bubble-emoji { opacity: 0.5; }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }
        .empty-emoji { font-size: 60px; margin-bottom: 20px; }
        .empty-text { font-size: 14px; color: rgba(0,0,0,0.5); line-height: 1.6; margin-bottom: 25px; }
        .empty-btn {
            padding: 14px 30px;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border: none;
            border-radius: 25px;
            color: white;
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        
        .modal {
            width: 90%;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .modal-title { flex: 1; font-size: 16px; font-weight: 600; color: #333; }
        .modal-close { width: 32px; height: 32px; background: rgba(255,255,255,0.4); border: none; border-radius: 50%; font-size: 18px; cursor: pointer; }
        
        .modal-content { padding: 20px; }
        
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 11px; color: rgba(0,0,0,0.6); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
        .input-field { width: 100%; padding: 12px 14px; border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; font-size: 14px; font-family: 'Comfortaa', sans-serif; background: rgba(255,255,255,0.4); color: #333; }
        .input-field:focus { outline: none; border-color: #6B4E9B; }
        
        .emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; }
        .emoji-option { width: 42px; height: 42px; background: rgba(255,255,255,0.4); border: 2px solid transparent; border-radius: 10px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .emoji-option.selected { border-color: #6B4E9B; background: rgba(255,255,255,0.7); }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 14px; font-family: 'Comfortaa', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #6B4E9B, #9B6B9B); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.5); color: #333; }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 90;
        }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 16px; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-content">
                <div class="header-title">
                    <span id="domainEmoji">💪</span>
                    <span id="domainName">Santé</span>
                </div>
                <div class="header-subtitle">Tes activités dans ce domaine</div>
            </div>
        </div>
        
        <div class="content">
            <div class="bubbles-container" id="bubblesContainer"></div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToVision()">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item active">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Arbre</div>
            </div>
            <div class="menu-item" onclick="goToTasks()">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
        
        <!-- Modal ajout activité -->
        <div class="modal-overlay" id="addModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">Nouvelle activité</div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Nom de l'activité</label>
                        <input type="text" class="input-field" id="activityName" placeholder="Ex: Sport, Méditation, Nutrition...">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-picker" id="emojiPicker"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveActivity()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const currentDomainId = localStorage.getItem('wutree_current_domain') || 'sante';
        
        const ACTIVITY_EMOJIS = {
            sante: ['🏋️', '🧘', '🥋', '🏃', '🚴', '🥗', '💊', '😴', '🧠', '💆', '🏊', '⚽'],
            business: ['📈', '💻', '📊', '🎯', '📱', '💡', '📝', '🤝', '💵', '🏦', '📧', '🎤'],
            relations: ['👨‍👩‍👧', '💑', '👥', '🤝', '💬', '🎁', '📞', '❤️', '👋', '🫂', '🍽️', '☕'],
            connaissance: ['📖', '🎓', '💻', '🧪', '🎨', '🎵', '🌍', '🧩', '✍️', '🔬', '📚', '🎧'],
            loisirs: ['🎮', '🎬', '🎵', '📚', '🎨', '⚽', '🎯', '🎸', '📷', '🎭', '🧩', '🌿'],
            maison: ['🧹', '🛠️', '🌱', '🍳', '🛋️', '🔧', '📦', '🏠', '🪴', '✨', '🧺', '🪑'],
            voyages: ['✈️', '🏖️', '⛺', '🗺️', '🎒', '🚗', '🏔️', '🌴', '📸', '🧳', '🚂', '🛳️']
        };
        
        function init() {
            loadDomainInfo();
            renderActivities();
            setupEmojiPicker();
        }
        
        function loadDomainInfo() {
            const domains = JSON.parse(localStorage.getItem('wutree_domains') || '[]');
            const domain = domains.find(d => d.id === currentDomainId);
            if (domain) {
                document.getElementById('domainEmoji').textContent = domain.emoji;
                document.getElementById('domainName').textContent = domain.name;
            }
        }
        
        function setupEmojiPicker() {
            const emojis = ACTIVITY_EMOJIS[currentDomainId] || ACTIVITY_EMOJIS.sante;
            document.getElementById('emojiPicker').innerHTML = emojis.map((e, i) => 
                `<div class="emoji-option ${i === 0 ? 'selected' : ''}" onclick="selectEmoji(this)">${e}</div>`
            ).join('');
        }
        
        function selectEmoji(el) {
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        // ========== ACTIVITIES ==========
        function getActivities() {
            return JSON.parse(localStorage.getItem('wutree_activities') || '[]').filter(a => a.domainId === currentDomainId);
        }
        
        function saveActivities(activities) {
            const all = JSON.parse(localStorage.getItem('wutree_activities') || '[]').filter(a => a.domainId !== currentDomainId);
            localStorage.setItem('wutree_activities', JSON.stringify([...all, ...activities]));
        }
        
        function getActivityStats(activityId) {
            const objectives = JSON.parse(localStorage.getItem('wutree_objectives') || '[]').filter(o => o.activityId === activityId && !o.completed);
            const habits = JSON.parse(localStorage.getItem('wutree_domain_habits') || '[]').filter(h => h.activityId === activityId);
            const tasks = JSON.parse(localStorage.getItem('wutree_domain_tasks') || '[]').filter(t => t.activityId === activityId && !t.completed);
            return objectives.length + habits.length + tasks.length;
        }
        
        function renderActivities() {
            const container = document.getElementById('bubblesContainer');
            const activities = getActivities();
            
            if (activities.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-emoji">🌱</div>
                        <div class="empty-text">
                            Aucune activité dans ce domaine.<br>
                            Ajoute ta première activité !
                        </div>
                        <button class="empty-btn" onclick="openModal()">+ Ajouter une activité</button>
                    </div>
                `;
                return;
            }
            
            let html = activities.map(activity => {
                const count = getActivityStats(activity.id);
                const badgeClass = count === 0 ? 'bubble-badge empty' : 'bubble-badge';
                
                return `
                    <div class="bubble" onclick="openActivity('${activity.id}')">
                        <div class="${badgeClass}">${count}</div>
                        <div class="bubble-emoji">${activity.emoji}</div>
                        <div class="bubble-label">${activity.name}</div>
                    </div>
                `;
            }).join('');
            
            // Bulle d'ajout
            html += `
                <div class="bubble add-bubble" onclick="openModal()">
                    <div class="bubble-emoji">+</div>
                    <div class="bubble-label">Ajouter</div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function openActivity(activityId) {
            localStorage.setItem('wutree_current_activity', activityId);
            window.location.href = 'wu-tree-v2-activity.html';
        }
        
        // ========== MODAL ==========
        function openModal() {
            document.getElementById('activityName').value = '';
            setupEmojiPicker();
            document.getElementById('addModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('addModal').classList.remove('show');
        }
        
        function saveActivity() {
            const name = document.getElementById('activityName').value.trim();
            const emoji = document.querySelector('.emoji-option.selected')?.textContent || '⭐';
            
            if (!name) { alert('Entre un nom !'); return; }
            
            const activities = getActivities();
            activities.push({
                id: 'activity_' + Date.now(),
                domainId: currentDomainId,
                name,
                emoji,
                createdAt: new Date().toISOString()
            });
            
            saveActivities(activities);
            closeModal();
            renderActivities();
        }
        
        // ========== NAV ==========
        function goBack() { window.location.href = 'wu-tree-v2-home.html'; }
        function goToVision() { window.location.href = 'wu-tree-v2-visualization.html'; }
        function goToTasks() { window.location.href = 'wu-tree-v2-tasks.html'; }
        
        init();
    </script>
</body>
</html>
