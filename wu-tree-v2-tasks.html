<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree - Aujourd'hui</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Comfortaa', cursive;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .phone-frame { width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden; }
        
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        .header { position: absolute; top: 44px; left: 0; right: 0; height: 70px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0 15px; z-index: 90;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .header-title { font-family: 'Comfortaa', cursive; font-size: 20px; font-weight: 600;
            color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .header-date { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 4px; }
        
        .content { position: absolute; top: 114px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 15px 20px; z-index: 60; }
        
        /* Stats row */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            flex: 1;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }
        
        .stat-label {
            font-size: 10px;
            color: rgba(0,0,0,0.5);
            margin-top: 4px;
            text-transform: uppercase;
        }
        
        /* Section */
        .section {
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .section-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            color: rgba(0,0,0,0.6);
        }
        
        /* Event cards */
        .event-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        
        .event-card.done {
            opacity: 0.5;
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.3);
        }
        
        .event-emoji {
            font-size: 28px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.5);
            border-radius: 14px;
        }
        
        .event-info {
            flex: 1;
        }
        
        .event-domain {
            font-size: 10px;
            color: rgba(0,0,0,0.4);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        
        .event-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .event-objective {
            font-size: 11px;
            color: rgba(0,0,0,0.5);
            margin-top: 2px;
        }
        
        .event-check {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(76, 175, 80, 0.4);
            background: rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .event-check:active {
            transform: scale(0.95);
        }
        
        .event-check.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(0,0,0,0.4);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .empty-text {
            font-size: 13px;
        }
        
        /* Journal section */
        .journal-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 16px;
        }
        
        .journal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .journal-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .journal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .journal-save {
            padding: 6px 14px;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
        }
        
        .journal-save:disabled {
            opacity: 0.5;
        }
        
        .voice-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(107, 78, 155, 0.3);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .voice-btn.recording {
            background: #ff4444;
            border-color: #ff4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .section-add {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Manual task card */
        .manual-task-card {
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .manual-task-emoji {
            font-size: 20px;
        }
        
        .manual-task-info {
            flex: 1;
        }
        
        .manual-task-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .manual-task-time {
            font-size: 10px;
            color: rgba(0,0,0,0.4);
        }
        
        .manual-task-delete {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(244, 67, 54, 0.1);
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* Input styles for modal */
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            background: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Comfortaa', cursive;
            box-sizing: border-box;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #6B4E9B;
        }
        
        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .emoji-option {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 10px;
            cursor: pointer;
        }
        
        .emoji-option.selected {
            border-color: #6B4E9B;
            background: rgba(107, 78, 155, 0.2);
        }
        
        .journal-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            background: rgba(255,255,255,0.4);
            font-size: 13px;
            font-family: 'Comfortaa', cursive;
            resize: vertical;
            box-sizing: border-box;
        }
        
        .journal-textarea:focus {
            outline: none;
            border-color: #6B4E9B;
        }
        
        .journal-saved {
            font-size: 10px;
            color: rgba(0,0,0,0.4);
            margin-top: 8px;
            text-align: right;
        }
        
        /* Objective cards */
        .objective-mini-card {
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .objective-mini-card:active {
            transform: scale(0.98);
        }
        
        .objective-mini-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .objective-mini-emoji {
            font-size: 24px;
        }
        
        .objective-mini-info {
            flex: 1;
        }
        
        .objective-mini-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .objective-mini-deadline {
            font-size: 10px;
            color: rgba(0,0,0,0.5);
        }
        
        .objective-mini-deadline.urgent {
            color: #FF5722;
            font-weight: 600;
        }
        
        .objective-mini-domain {
            font-size: 10px;
            color: #6B4E9B;
        }
        
        .objective-mini-progress {
            height: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .objective-mini-fill {
            height: 100%;
            background: linear-gradient(90deg, #6B4E9B, #9B6B9B);
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        /* Quick eval modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal {
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.5);
            color: #333;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            color: white;
        }
        
        /* Quick eval fields */
        .quick-eval-field {
            margin-bottom: 16px;
        }
        
        .quick-eval-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .quick-eval-emojis {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        
        .eval-emoji {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .eval-emoji.selected {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border-color: #6B4E9B;
            transform: scale(1.1);
        }
        
        .quick-eval-input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            background: rgba(255,255,255,0.5);
            font-size: 13px;
            font-family: 'Comfortaa', cursive;
            box-sizing: border-box;
        }
        
        .quick-eval-input:focus {
            outline: none;
            border-color: #6B4E9B;
        }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 90;
        }
        
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 16px; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <div class="header-title">⚡ Aujourd'hui</div>
            <div class="header-date" id="headerDate">Mercredi 16 avril 2026</div>
        </div>
        
        <div class="content">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="statDone">0</div>
                    <div class="stat-label">Fait</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statRemaining">0</div>
                    <div class="stat-label">Restant</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statStreak">0</div>
                    <div class="stat-label">🔥 Streak</div>
                </div>
            </div>
            
            <!-- Événements du jour (fixes) -->
            <div class="section" id="dailySection">
                <div class="section-header">
                    <div class="section-title">📅 Aujourd'hui</div>
                    <div class="section-badge" id="dailyBadge">0</div>
                </div>
                <div id="dailyContainer"></div>
            </div>
            
            <!-- Événements de la semaine (flexibles) -->
            <div class="section" id="weeklySection">
                <div class="section-header">
                    <div class="section-title">🌊 Cette semaine</div>
                    <div class="section-badge" id="weeklyBadge">0</div>
                </div>
                <div id="weeklyContainer"></div>
            </div>
            
            <!-- Tâches manuelles -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">✨ Bonus accomplis</div>
                    <button class="section-add" onclick="openManualTaskModal()">+</button>
                </div>
                <div id="manualTasksContainer"></div>
            </div>
            
            <!-- Journal avec vocal -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">📝 Journal du jour</div>
                </div>
                <div class="journal-card">
                    <div class="journal-header">
                        <div class="journal-title">✍️ Notes personnelles</div>
                        <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecording()">🎤</button>
                    </div>
                    <textarea class="journal-textarea" id="journalText" placeholder="Comment s'est passée ta journée ? Réflexions, gratitudes, apprentissages..." oninput="onJournalInput()"></textarea>
                    <div class="journal-footer">
                        <div class="journal-saved" id="journalSaved"></div>
                        <button class="journal-save" id="journalSave" onclick="saveJournal()" disabled>Enregistrer</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToVision()">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item" onclick="goToHome()">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Arbre</div>
            </div>
            <div class="menu-item active">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
        
        <!-- Modal Quick Eval -->
        <div class="modal-overlay" id="quickEvalModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title" id="quickEvalTitle">⚡ Bilan rapide</div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-content">
                    <div id="quickEvalFields"></div>
                    
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveQuickEval()">✓ Valider</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal Manual Task -->
        <div class="modal-overlay" id="manualTaskModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">✨ Ajouter une action bonus</div>
                    <button class="modal-close" onclick="closeManualTaskModal()">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Qu'as-tu accompli ?</label>
                        <input type="text" class="input-field" id="manualTaskName" placeholder="Ex: Méditation, appel important...">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-picker" id="manualTaskEmojis"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeManualTaskModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveManualTask()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Domain config for eval types
        const DOMAIN_EVAL_CONFIG = {
            sante: {
                icon: '💪',
                fields: [
                    { id: 'effort', label: '💪 Effort', emojis: ['😴', '😌', '💪', '🔥', '🏆'] },
                    { id: 'energy', label: '⚡ Énergie après', emojis: ['😫', '😔', '😐', '😊', '🚀'] }
                ]
            },
            business: {
                icon: '💼',
                fields: [
                    { id: 'productivity', label: '📊 Productivité', emojis: ['😞', '😕', '😐', '👍', '🎯'] },
                    { id: 'focus', label: '🎯 Focus', emojis: ['🌀', '😵', '😐', '🧘', '💎'] }
                ]
            },
            connaissance: {
                icon: '📚',
                fields: [
                    { id: 'comprehension', label: '🧠 Compréhension', emojis: ['😕', '🤔', '😐', '💡', '🎓'] },
                    { id: 'progress', label: '📈 Progression', emojis: ['📉', '➖', '📊', '📈', '🚀'] }
                ]
            },
            relations: {
                icon: '👥',
                fields: [
                    { id: 'quality', label: '💝 Qualité', emojis: ['😞', '😕', '😊', '💖', '✨'] },
                    { id: 'connection', label: '🤝 Connexion', emojis: ['😶', '🙂', '😊', '🫂', '💞'] }
                ]
            },
            creativite: {

        function updateHeaderDate() {
            const today = new Date();
            const dayName = DAYS[today.getDay()];
            const day = today.getDate();
            const month = MONTHS[today.getMonth()];
            const year = today.getFullYear();
            document.getElementById('headerDate').textContent = `${dayName} ${day} ${month} ${year}`;
        }
        
        function loadTodayEvents() {
            const today = new Date();
            const todayDayIndex = today.getDay() === 0 ? 6 : today.getDay() - 1; // 0=Monday, 6=Sunday
            const todayStr = today.toISOString().split('T')[0];
            
            // Get all sessions from all objectives
            const allSessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]');
            const allObjectives = JSON.parse(localStorage.getItem('wutree_objectives') || '[]');
            const allActivities = JSON.parse(localStorage.getItem('wutree_activities') || '[]');
            const allDomains = JSON.parse(localStorage.getItem('wutree_domains') || '[]');
            const allHistory = JSON.parse(localStorage.getItem('wutree_objective_logs') || '[]');
            
            // Get completed sessions today (by unique session ID)
            const completedToday = new Set(
                allHistory
                    .filter(h => h.date === todayStr)
                    .map(h => h.sessionId)
            );
            
            // Separate daily and weekly events
            const dailyEvents = [];
            const weeklyEvents = [];
            
            // Process ALL sessions
            allSessions.forEach(session => {
                // Get objective info
                const objective = allObjectives.find(o => o.id === session.objectiveId);
                if (!objective) return;
                
                const activity = allActivities.find(a => a.id === objective.activityId);
                const domain = allDomains.find(d => d.id === (activity?.domainId || objective.domainId));
                
                // Check if already completed today
                const isDone = completedToday.has(session.id);
                
                const eventData = {
                    sessionId: session.id,
                    objectiveId: objective.id,
                    domainId: domain?.id || 'sante',
                    domainName: domain?.name || 'Santé',
                    domainEmoji: domain?.emoji || '💪',
                    objectiveName: objective.name,
                    sessionName: session.name,
                    sessionEmoji: session.emoji,
                    isDone,
                    type: session.type || 'fixed'
                };
                
                // Determine where to show this session
                const isFlexible = session.type === 'flexible';
                const isForToday = !isFlexible && (session.days || []).includes(todayDayIndex);
                
                if (isForToday) {
                    // Fixed session scheduled for today
                    eventData.desc = 'Prévu aujourd\'hui';
                    dailyEvents.push(eventData);
                } else if (isFlexible) {
                    // Flexible session - show in weekly
                    const weekStart = new Date(today);
                    weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));
                    weekStart.setHours(0, 0, 0, 0);
                    
                    const weekLogs = allHistory.filter(h => {
                        if (h.sessionId !== session.id) return false;
                        return new Date(h.date) >= weekStart;
                    });
                    
                    const done = weekLogs.length;
                    const target = session.frequency || 1;
                    
                    eventData.desc = `${done}/${target} cette semaine`;
                    eventData.weeklyDone = done;
                    eventData.weeklyTarget = target;
                    
                    // Always show flexible sessions (even if target reached, so user can see progress)
                    weeklyEvents.push(eventData);
                }
            });
            
            renderDailyEvents(dailyEvents);
            renderWeeklyEvents(weeklyEvents);
            
            // Show empty state if nothing scheduled
            if (dailyEvents.length === 0 && weeklyEvents.length === 0) {
                document.getElementById('dailySection').style.display = 'block';
                document.getElementById('dailyContainer').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: rgba(0,0,0,0.4); font-size: 12px;">
                        🌿 Aucune session prévue.<br>
                        <span style="font-size: 10px;">Crée des sessions dans tes objectifs pour les voir ici.</span>
                    </div>
                `;
                document.getElementById('dailyBadge').textContent = '0';
            }
        }
        
        function renderDailyEvents(events) {
            const container = document.getElementById('dailyContainer');

            // Update badge
            const remaining = events.filter(e => !e.isDone).length;

            if (events.length === 0) {
                section.style.display = 'none';

            section.style.display = 'block';
            
            // Sort: not done first
            events.sort((a, b) => a.isDone - b.isDone);

                <div class="event-card ${event.isDone ? 'done' : ''}" data-session-id="${event.sessionId}">

        // ========== OBJECTIVES ==========
        function loadObjectives() {
            const container = document.getElementById('objectivesContainer');
            const section = document.getElementById('objectivesSection');
            
            const allObjectives = JSON.parse(localStorage.getItem('wutree_objectives') || '[]');
            const allActivities = JSON.parse(localStorage.getItem('wutree_activities') || '[]');
            const allDomains = JSON.parse(localStorage.getItem('wutree_domains') || '[]');
            const allHistory = JSON.parse(localStorage.getItem('wutree_objective_logs') || '[]');
            const allSessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]');
            
            // Filter non-completed objectives
            const activeObjectives = allObjectives.filter(obj => !obj.completed);
            
            if (activeObjectives.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            
            // Calculate progress for each objective
            const today = new Date();
            
            const objectivesData = activeObjectives.map(obj => {
                const activity = allActivities.find(a => a.id === obj.activityId);
                const domain = allDomains.find(d => d.id === (activity?.domainId || obj.domainId));
                
                // Calculate progress based on sessions completed this week
                const sessions = allSessions.filter(s => s.objectiveId === obj.id);
                let totalTarget = 0;
                let totalDone = 0;
                
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));
                weekStart.setHours(0, 0, 0, 0);
                
                sessions.forEach(session => {
                    if (session.type === 'flexible') {
                        totalTarget += session.frequency || 1;
                    } else {
                        totalTarget += (session.days || []).length;
                    }
                    
                    const weekLogs = allHistory.filter(h => {
                        if (h.sessionId !== session.id) return false;
                        return new Date(h.date) >= weekStart;
                    });
                    totalDone += weekLogs.length;
                });
                
                const progress = totalTarget > 0 ? Math.min(100, Math.round((totalDone / totalTarget) * 100)) : 0;
                
                // Calculate days remaining
                const deadline = new Date(obj.deadline);
                const daysRemaining = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
                
                return {
                    id: obj.id,
                    name: obj.name,
                    emoji: obj.emoji,
                    deadline: obj.deadline,
                    daysRemaining,
                    progress,
                    domainName: domain?.name || 'Domaine',
                    domainEmoji: domain?.emoji || '📁',
                    activityId: obj.activityId
                };
            });
            
            // Sort by deadline (soonest first)
            objectivesData.sort((a, b) => a.daysRemaining - b.daysRemaining);
            
            container.innerHTML = objectivesData.map(obj => {
                const deadlineDate = new Date(obj.deadline);
                const deadlineStr = deadlineDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                const isUrgent = obj.daysRemaining <= 7 && obj.daysRemaining > 0;
                const isOverdue = obj.daysRemaining < 0;
                
                let deadlineText = `📅 ${deadlineStr}`;
                if (isOverdue) {
                    deadlineText = `⚠️ Dépassé de ${Math.abs(obj.daysRemaining)}j`;
                } else if (obj.daysRemaining === 0) {
                    deadlineText = `🔥 Aujourd'hui !`;
                } else if (isUrgent) {
                    deadlineText = `⏰ ${obj.daysRemaining}j restants`;
                } else {
                    deadlineText = `📅 ${deadlineStr} (${obj.daysRemaining}j)`;
                }
                
                return `
                    <div class="objective-mini-card" onclick="goToObjective('${obj.id}', '${obj.activityId}')">
                        <div class="objective-mini-header">
                            <div class="objective-mini-emoji">${obj.emoji}</div>
                            <div class="objective-mini-info">
                                <div class="objective-mini-name">${obj.name}</div>
                                <div class="objective-mini-domain">${obj.domainEmoji} ${obj.domainName}</div>
                                <div class="objective-mini-deadline ${isUrgent || isOverdue ? 'urgent' : ''}">${deadlineText}</div>
                            </div>
                            <div style="font-size: 12px; color: #6B4E9B; font-weight: 600;">${obj.progress}%</div>
                        </div>
                        <div class="objective-mini-progress">
                            <div class="objective-mini-fill" style="width: ${obj.progress}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function goToObjective(objectiveId, activityId) {
            localStorage.setItem('wutree_current_objective', objectiveId);
            localStorage.setItem('wutree_current_activity', activityId);

        function toggleEvent(sessionId, domainId, objectiveId) {
            const todayStr = new Date().toISOString().split('T')[0];
            let history = JSON.parse(localStorage.getItem('wutree_objective_logs') || '[]');
            
            // Check if already done today
            const existingLogIndex = history.findIndex(h => h.sessionId === sessionId && h.date === todayStr);
            
            if (existingLogIndex >= 0) {
                // Already done - ask to uncheck
                if (confirm('Décocher cette session ?')) {
                    history.splice(existingLogIndex, 1);
                    localStorage.setItem('wutree_objective_logs', JSON.stringify(history));
                    loadTodayEvents();
                    updateStats();
                }
                return;
            }
            
            // Show quick eval modal
            currentEvent = { sessionId, domainId, objectiveId };
            
            const sessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]');
            const session = sessions.find(s => s.id === sessionId);
            
            document.getElementById('quickEvalTitle').textContent = `${session?.emoji || '📝'} ${session?.name || 'Session'}`;
            
            renderQuickEvalFields(domainId);

        function saveQuickEval() {
            if (!currentEvent) return;
            
            const { sessionId, domainId, objectiveId } = currentEvent;
            const sessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]');
            const session = sessions.find(s => s.id === sessionId);
            
            // Collect eval data
            const evalData = {};
            document.querySelectorAll('.quick-eval-emojis').forEach(container => {
                const fieldId = container.dataset.field;
                const selected = container.querySelector('.eval-emoji.selected');
                evalData[fieldId] = selected ? parseInt(selected.dataset.value) : 3;
            });
            
            const note = document.getElementById('quickEvalNote').value.trim();
            const todayStr = new Date().toISOString().split('T')[0];
            
            // Get history and check for duplicates
            let history = JSON.parse(localStorage.getItem('wutree_objective_logs') || '[]');
            const existingIndex = history.findIndex(h => h.sessionId === sessionId && h.date === todayStr);
            
            if (existingIndex >= 0) {
                // Update existing - shouldn't happen but safety
                history[existingIndex] = {
                    ...history[existingIndex],
                    ...evalData,
                    notes: note,
                    updatedAt: new Date().toISOString()
                };
            } else {
                // Add new log
                history.push({
                    id: 'log_' + Date.now(),
                    objectiveId,
                    sessionId,
                    date: todayStr,
                    exercises: session?.program || '',
                    notes: note,
                    ...evalData,
                    createdAt: new Date().toISOString()
                });
            }
            
            localStorage.setItem('wutree_objective_logs', JSON.stringify(history));
            
            currentEvent = null;
            closeModal();
            
            loadTodayEvents();
            updateStats();
        }

        function updateStats() {
            const todayStr = new Date().toISOString().split('T')[0];
            const history = JSON.parse(localStorage.getItem('wutree_objective_logs') || '[]');
            
            // Count done today
            const doneToday = history.filter(h => h.date === todayStr).length;
            document.getElementById('statDone').textContent = doneToday;
            
            // Count remaining
            const todayDayIndex = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
            const allSessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]');
            const completedIds = new Set(history.filter(h => h.date === todayStr).map(h => h.sessionId));
            
            let remaining = 0;
            allSessions.forEach(session => {
                if (completedIds.has(session.id)) return;
                
                if (session.type !== 'flexible' && (session.days || []).includes(todayDayIndex)) {
                    remaining++;
                }
            });
            document.getElementById('statRemaining').textContent = remaining;
            
            // Calculate streak (consecutive days with at least one completed session)
            const streak = calculateStreak(history);
            document.getElementById('statStreak').textContent = streak;
        }
        
        function calculateStreak(history) {
            if (history.length === 0) return 0;
            
            // Get unique dates sorted
            const dates = [...new Set(history.map(h => h.date))].sort().reverse();
            
            const today = new Date().toISOString().split('T')[0];
            const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            
            // Start counting from today or yesterday
            let streak = 0;
            let checkDate = dates.includes(today) ? today : yesterday;
            
            if (!dates.includes(today) && !dates.includes(yesterday)) {
                return 0;
            }
            
            while (dates.includes(checkDate)) {
                streak++;
                const nextDate = new Date(checkDate);
                nextDate.setDate(nextDate.getDate() - 1);
                checkDate = nextDate.toISOString().split('T')[0];
            }
            
            return streak;
        }

        // ========== VOICE RECORDING ==========
        function setupVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';
                
                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    const journalText = document.getElementById('journalText');
                    journalText.value = journalText.value + transcript;
                    onJournalInput();
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    stopRecording();
                };
                
                recognition.onend = () => {
                    if (isRecording) {
                        recognition.start(); // Continue if still recording
                    }
                };
            }
        }
        
        function toggleVoiceRecording() {
            if (!recognition) {
                alert('La reconnaissance vocale n\'est pas supportée sur ce navigateur.');
                return;
            }
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        function startRecording() {
            isRecording = true;
            document.getElementById('voiceBtn').classList.add('recording');
            document.getElementById('voiceBtn').textContent = '⏹️';
            recognition.start();
        }
        
        function stopRecording() {
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').textContent = '🎤';
            if (recognition) recognition.stop();
        }

        function selectManualEmoji(el) {
            document.querySelectorAll('#manualTaskEmojis .emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        function saveManualTask() {
            const name = document.getElementById('manualTaskName').value.trim();
            const emoji = document.querySelector('#manualTaskEmojis .emoji-option.selected')?.textContent || '✨';
            
            if (!name) {
                alert('Entre ce que tu as accompli !');
                return;
            }
            
            const todayStr = new Date().toISOString().split('T')[0];
            const allTasks = JSON.parse(localStorage.getItem('wutree_manual_tasks') || '[]');
            
            allTasks.push({
                id: 'manual_' + Date.now(),
                name,
                emoji,
                date: todayStr,
                createdAt: new Date().toISOString()
            });
            
            localStorage.setItem('wutree_manual_tasks', JSON.stringify(allTasks));
            
            closeManualTaskModal();
            loadManualTasks();
            updateStats();
        }
        
        function deleteManualTask(taskId) {
            let allTasks = JSON.parse(localStorage.getItem('wutree_manual_tasks') || '[]');
            allTasks = allTasks.filter(t => t.id !== taskId);
            localStorage.setItem('wutree_manual_tasks', JSON.stringify(allTasks));
            loadManualTasks();
            updateStats();
        }
        
        // Navigation
        function goToVision() { window.location.href = 'wu-tree-v2-visualization.html'; }
        function goToHome() { window.location.href = 'wu-tree-v2-home.html'; }
        
        init();
    </script>
</body>
</html>
