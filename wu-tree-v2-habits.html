<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree - Nouvelles Habitudes</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .phone-frame {
            width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        .header {
            position: absolute; top: 44px; left: 0; right: 0; height: 60px;
            display: flex; align-items: center; padding: 0 20px; z-index: 80;
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.3); border: none;
            font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .header-title {
            flex: 1; text-align: center; font-size: 18px;
            font-weight: 600; color: white; margin-right: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }
        
        .content {
            position: absolute; top: 104px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 20px;
            z-index: 60;
        }
        
        /* Habit Card */
        .habit-card {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            animation: floatCard 5s ease-in-out infinite;
        }
        .habit-card:nth-child(2) { animation-delay: -2s; }
        .habit-card:nth-child(3) { animation-delay: -4s; }
        
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .habit-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px;
        }
        .habit-emoji { font-size: 32px; }
        .habit-info { flex: 1; }
        .habit-name {
            font-size: 16px; font-weight: 600; color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .habit-status {
            font-size: 11px; color: rgba(255,255,255,0.8);
            margin-top: 2px;
        }
        
        /* Progress bar */
        .progress-container {
            margin-bottom: 12px;
        }
        .progress-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: rgba(255,255,255,0.9);
            margin-bottom: 6px;
        }
        .progress-bar {
            height: 12px; background: rgba(255,255,255,0.3);
            border-radius: 6px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #98D89E 0%, #4CAF50 100%);
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        
        /* Week dots */
        .week-dots {
            display: flex; justify-content: center; gap: 8px;
            margin: 16px 0;
        }
        .day-dot {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .dot {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: white;
            cursor: pointer; transition: all 0.3s;
        }
        .dot.done {
            background: linear-gradient(135deg, #98D89E 0%, #4CAF50 100%);
            border-color: #4CAF50;
        }
        .dot.today {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .dot.future {
            opacity: 0.4;
            cursor: default;
        }
        .day-label {
            font-size: 9px; color: rgba(255,255,255,0.7);
        }
        
        /* Validate button */
        .validate-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #98D89E 0%, #4CAF50 100%);
            border: none; border-radius: 16px;
            color: white; font-family: 'Comfortaa', sans-serif;
            font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        .validate-btn:active { transform: scale(0.98); }
        .validate-btn.done {
            background: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }
        
        /* Empty state */
        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-emoji { font-size: 64px; margin-bottom: 20px; }
        .empty-text {
            font-size: 16px; color: white; line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        
        /* FAB */
        .fab {
            position: absolute; bottom: 90px; right: 20px;
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white; font-size: 28px;
            border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
            transition: all 0.3s;
        }
        .fab:active { transform: scale(0.95); }
        
        /* Modal */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 100%);
            border-radius: 24px; padding: 24px; width: 100%;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .modal-title {
            font-size: 18px; font-weight: 600; color: white;
            text-align: center; margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .modal-input {
            width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px; font-size: 16px;
            font-family: 'Comfortaa', sans-serif;
            color: #333; margin-bottom: 12px;
        }
        .modal-input::placeholder { color: rgba(0,0,0,0.4); }
        .emoji-picker {
            display: flex; flex-wrap: wrap; gap: 10px;
            justify-content: center; margin-bottom: 20px;
        }
        .emoji-option {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.3);
            border: 2px solid transparent;
            font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .emoji-option.selected {
            border-color: white;
            background: rgba(255,255,255,0.5);
        }
        .modal-buttons {
            display: flex; gap: 12px;
        }
        .modal-btn {
            flex: 1; padding: 14px;
            border: none; border-radius: 12px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .modal-btn.cancel {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .modal-btn.confirm {
            background: linear-gradient(135deg, #98D89E 0%, #4CAF50 100%);
            color: white;
        }
        
        /* Bottom menu */
        .bottom-menu { position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 90; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 8px 16px; border-radius: 12px; transition: all 0.3s; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(74, 90, 79, 0.8); font-weight: 500; }
        
        /* Celebration */
        .celebration {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px; z-index: 300;
            animation: celebrate 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes celebrate {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">🌱 Nouvelles Habitudes</div>
        </div>
        
        <div class="content" id="habitsContainer"></div>
        
        <button class="fab" onclick="openModal()">+</button>
        
        <!-- Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-title">Nouvelle habitude</div>
                <input type="text" class="modal-input" id="habitName" placeholder="Nom de l'habitude...">
                <div class="emoji-picker" id="emojiPicker"></div>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
                    <button class="modal-btn confirm" onclick="addHabit()">Ajouter</button>
                </div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item active"><div class="menu-icon">✨</div><div class="menu-label">Bien-être</div></div>
            <div class="menu-item" onclick="goToHome()"><div class="menu-icon">🌳</div><div class="menu-label">Arbre</div></div>
            <div class="menu-item" onclick="goToTasks()"><div class="menu-icon">📋</div><div class="menu-label">Tâches</div></div>
        </div>
    </div>
    
    <script>
        const EMOJIS = ['🚿', '🧘', '📖', '🏃', '💧', '🥗', '😴', '📝', '🎯', '💪', '🧠', '🌅'];
        let selectedEmoji = '🌱';
        
        // Init emoji picker
        function initEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = EMOJIS.map(e => 
                `<div class="emoji-option ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>`
            ).join('');
        }
        
        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            document.querySelectorAll('.emoji-option').forEach(el => {
                el.classList.toggle('selected', el.textContent === emoji);
            });
        }
        
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('habitName').value = '';
            selectedEmoji = '🌱';
            initEmojiPicker();
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
        function getHabits() {
            return JSON.parse(localStorage.getItem('wutree_habits') || '[]');
        }
        
        function saveHabits(habits) {
            localStorage.setItem('wutree_habits', JSON.stringify(habits));
        }
        
        function addHabit() {
            const name = document.getElementById('habitName').value.trim();
            if (!name) return;
            
            const habits = getHabits();
            const today = new Date().toISOString().split('T')[0];
            
            habits.push({
                id: Date.now().toString(),
                name: name,
                emoji: selectedEmoji,
                startDate: today,
                completedDays: [],
                validated: false
            });
            
            saveHabits(habits);
            closeModal();
            renderHabits();
        }
        
        function getDateStr(date) {
            return date.toISOString().split('T')[0];
        }
        
        function getDaysDiff(date1, date2) {
            const d1 = new Date(date1);
            const d2 = new Date(date2);
            return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }
        
        function getWeekDays(habit) {
            const today = new Date();
            const startOfWeek = new Date(today);
            const dayOfWeek = today.getDay();
            const diff = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // Monday = 0
            startOfWeek.setDate(today.getDate() - diff);
            
            const days = [];
            const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                const dateStr = getDateStr(date);
                const todayStr = getDateStr(today);
                
                days.push({
                    label: dayNames[i],
                    date: dateStr,
                    done: habit.completedDays.includes(dateStr),
                    isToday: dateStr === todayStr,
                    isFuture: dateStr > todayStr
                });
            }
            return days;
        }
        
        function toggleDay(habitId, dateStr) {
            const habits = getHabits();
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;
            
            const today = getDateStr(new Date());
            if (dateStr > today) return; // Can't mark future days
            
            const idx = habit.completedDays.indexOf(dateStr);
            if (idx === -1) {
                habit.completedDays.push(dateStr);
                // Celebration if today
                if (dateStr === today) {
                    showCelebration();
                }
            } else {
                habit.completedDays.splice(idx, 1);
            }
            
            // Check if validated (21 days in 28)
            const startDate = new Date(habit.startDate);
            const daysSinceStart = getDaysDiff(habit.startDate, today) + 1;
            
            if (habit.completedDays.length >= 21) {
                habit.validated = true;
            }
            
            // Reset if 28 days passed without 21 completed
            if (daysSinceStart > 28 && habit.completedDays.length < 21) {
                habit.startDate = today;
                habit.completedDays = [];
                habit.validated = false;
            }
            
            saveHabits(habits);
            renderHabits();
        }
        
        function showCelebration() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = '✨';
            document.querySelector('.phone-frame').appendChild(celebration);
            setTimeout(() => celebration.remove(), 1000);
        }
        
        function deleteHabit(id) {
            if (!confirm('Supprimer cette habitude ?')) return;
            let habits = getHabits();
            habits = habits.filter(h => h.id !== id);
            saveHabits(habits);
            renderHabits();
        }
        
        function renderHabits() {
            const habits = getHabits();
            const container = document.getElementById('habitsContainer');
            const today = getDateStr(new Date());
            
            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-emoji">🌱</div>
                        <p class="empty-text">Aucune habitude pour l'instant.<br><br>Appuie sur + pour commencer<br>ton parcours Kaizen.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = habits.map(habit => {
                const daysSinceStart = getDaysDiff(habit.startDate, today) + 1;
                const dayInCycle = Math.min(daysSinceStart, 28);
                const completed = habit.completedDays.length;
                const progress = Math.min((completed / 21) * 100, 100);
                const weekDays = getWeekDays(habit);
                const todayDone = habit.completedDays.includes(today);
                
                let statusText = `⏳ Jour ${dayInCycle}/28`;
                if (habit.validated) {
                    statusText = '🎉 Habitude ancrée !';
                }
                
                return `
                    <div class="habit-card" oncontextmenu="event.preventDefault(); deleteHabit('${habit.id}')">
                        <div class="habit-header">
                            <div class="habit-emoji">${habit.emoji}</div>
                            <div class="habit-info">
                                <div class="habit-name">${habit.name}</div>
                                <div class="habit-status">${statusText}</div>
                            </div>
                        </div>
                        
                        <div class="progress-container">
                            <div class="progress-labels">
                                <span>${completed}/21 jours</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        
                        <div class="week-dots">
                            ${weekDays.map(day => `
                                <div class="day-dot">
                                    <div class="dot ${day.done ? 'done' : ''} ${day.isToday ? 'today' : ''} ${day.isFuture ? 'future' : ''}"
                                         onclick="${day.isFuture ? '' : `toggleDay('${habit.id}', '${day.date}')`}">
                                        ${day.done ? '✓' : ''}
                                    </div>
                                    <div class="day-label">${day.label}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <button class="validate-btn ${todayDone ? 'done' : ''}" 
                                onclick="toggleDay('${habit.id}', '${today}')">
                            ${todayDone ? '✓ Fait aujourd\'hui' : '✓ Valider aujourd\'hui'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        function goBack() { window.location.href = 'wu-tree-v2-wellbeing.html'; }
        function goToHome() { window.location.href = 'wu-tree-v2-home.html'; }
        function goToTasks() { window.location.href = 'wu-tree-v2-tasks.html'; }
        
        // Init
        renderHabits();
    </script>
</body>
</html>
