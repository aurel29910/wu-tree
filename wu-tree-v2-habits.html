<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Nouvelles Habitudes</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        .status-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100;
        }
        
        .header {
            position: absolute; top: 44px; left: 0; right: 0; height: 60px;
            display: flex; align-items: center; padding: 0 20px;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); z-index: 90;
        }
        
        .back-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.5); border: none;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        .header-title {
            flex: 1; text-align: center;
            font-size: 18px; font-weight: 600; color: white;
            text-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-right: 36px;
        }
        
        .content {
            position: absolute; top: 104px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 20px;
        }
        
        /* Intro section */
        .intro {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .intro-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .intro-text {
            font-size: 12px;
            color: rgba(0,0,0,0.6);
            line-height: 1.5;
        }
        
        /* Level badges */
        .levels-row {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        
        .level-badge {
            text-align: center;
        }
        
        .level-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .level-days {
            font-size: 9px;
            color: rgba(0,0,0,0.5);
        }
        
        /* Habit card */
        .habit-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .habit-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .habit-emoji {
            font-size: 36px;
        }
        
        .habit-info {
            flex: 1;
        }
        
        .habit-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .habit-start {
            font-size: 11px;
            color: rgba(0,0,0,0.5);
        }
        
        .habit-delete {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,100,100,0.2);
            border: none;
            color: #ff4444;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Progress bar */
        .habit-progress {
            margin-bottom: 12px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .progress-level {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .progress-level-icon {
            font-size: 20px;
        }
        
        .progress-level-name {
            font-size: 12px;
            font-weight: 600;
            color: #6B4E9B;
        }
        
        .progress-days {
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }
        
        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s;
        }
        
        .progress-fill.level-1 { background: linear-gradient(90deg, #81C784, #4CAF50); }
        .progress-fill.level-2 { background: linear-gradient(90deg, #4DB6AC, #00897B); }
        .progress-fill.level-3 { background: linear-gradient(90deg, #7986CB, #5C6BC0); }
        .progress-fill.level-4 { background: linear-gradient(90deg, #FFD54F, #FFC107); }
        
        /* Level milestones */
        .milestones {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            padding: 0 2px;
        }
        
        .milestone {
            font-size: 12px;
            opacity: 0.4;
        }
        
        .milestone.reached {
            opacity: 1;
        }
        
        /* Benefits message */
        .habit-benefits {
            background: rgba(107, 78, 155, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        
        .benefits-title {
            font-size: 11px;
            font-weight: 600;
            color: #6B4E9B;
            margin-bottom: 6px;
        }
        
        .benefits-text {
            font-size: 11px;
            color: #333;
            line-height: 1.5;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(0,0,0,0.4);
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .empty-text {
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        /* FAB */
        .fab {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(107, 78, 155, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }
        
        .fab:active {
            transform: scale(0.95);
        }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 90;
        }
        
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 16px; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal {
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
        
        .modal-content {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            background: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Comfortaa', cursive;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #6B4E9B;
        }
        
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }
        
        .emoji-option {
            width: 100%;
            aspect-ratio: 1;
            font-size: 24px;
            background: rgba(255,255,255,0.4);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .emoji-option.selected {
            border-color: #6B4E9B;
            background: rgba(107, 78, 155, 0.2);
        }
        
        .btn {
            padding: 14px 24px;
            border-radius: 25px;
            font-family: 'Comfortaa', cursive;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            color: white;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">🌱 Nouvelles Habitudes</div>
        </div>
        
        <div class="content">
            <div class="intro">
                <div class="intro-title">Ancre tes nouvelles habitudes</div>
                <div class="intro-text">
                    Il faut environ 21 jours pour créer une habitude, 90 jours pour l'ancrer, et 9 mois pour qu'elle devienne une seconde nature.
                </div>
                <div class="levels-row">
                    <div class="level-badge">
                        <div class="level-icon">🌱</div>
                        <div class="level-days">21 jours</div>
                    </div>
                    <div class="level-badge">
                        <div class="level-icon">🌿</div>
                        <div class="level-days">3 mois</div>
                    </div>
                    <div class="level-badge">
                        <div class="level-icon">🌲</div>
                        <div class="level-days">6 mois</div>
                    </div>
                    <div class="level-badge">
                        <div class="level-icon">🌳</div>
                        <div class="level-days">9 mois</div>
                    </div>
                </div>
            </div>
            
            <div id="habitsContainer"></div>
        </div>
        
        <button class="fab" onclick="openAddModal()">+</button>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToVision()">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item" onclick="goBack()">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Home</div>
            </div>
            <div class="menu-item" onclick="goToTasks()">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
        
        <!-- Modal Ajouter Habitude -->
        <div class="modal-overlay" id="addModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">🌱 Nouvelle habitude</div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Nom de l'habitude</label>
                        <input type="text" class="input-field" id="habitName" placeholder="Ex: Jeûne intermittent">
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Date de début</label>
                        <input type="date" class="input-field" id="habitStartDate">
                    </div>
                    
                    <button class="btn btn-primary" onclick="saveHabit()">✨ Ajouter</button>
                </div>
            </div>
        </div>
        
        <!-- Modal Bénéfices -->
        <div class="modal-overlay" id="benefitsModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title" id="benefitsTitle">🎉 Félicitations !</div>
                    <button class="modal-close" onclick="closeBenefitsModal()">×</button>
                </div>
                <div class="modal-content">
                    <div id="benefitsContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const HABIT_EMOJIS = ['🧊', '🥗', '🏃', '📚', '🧘', '💤', '💧', '🚭', '🍎', '✍️', '🎯', '💪'];
        
        const LEVELS = [
            { days: 21, icon: '🌱', name: 'Germination', color: 'level-1' },
            { days: 90, icon: '🌿', name: 'Croissance', color: 'level-2' },
            { days: 180, icon: '🌲', name: 'Enracinement', color: 'level-3' },
            { days: 270, icon: '🌳', name: 'Intégré', color: 'level-4' }
        ];
        
        const BENEFITS_MESSAGES = {
            'Jeûne intermittent': {
                1: "🎉 21 jours de jeûne intermittent ! Ton corps commence à s'adapter. Tu ressens probablement déjà plus de clarté mentale et moins de fringales.",
                2: "🌟 3 mois ! L'autophagie est devenue régulière. Ton métabolisme s'est optimisé, ta sensibilité à l'insuline s'améliore nettement.",
                3: "💪 6 mois ! Le jeûne est devenu naturel. Ton corps brûle efficacement les graisses, ton énergie est stable toute la journée.",
                4: "🏆 9 mois ! Le jeûne fait partie de toi. Bénéfices durables : longévité cellulaire, santé métabolique optimale, relation saine avec la nourriture."
            },
            'Douche froide': {
                1: "🎉 21 jours de douches froides ! Ton système immunitaire se renforce. Tu ressens déjà plus d'énergie et de vitalité le matin.",
                2: "🌟 3 mois ! Ton corps thermorégule mieux. Réduction du stress, amélioration de la circulation, peau et cheveux plus sains.",
                3: "💪 6 mois ! L'inconfort est devenu confort. Ta résilience mentale est renforcée, ton système nerveux est plus équilibré.",
                4: "🏆 9 mois ! La douche froide est un plaisir. Système immunitaire robuste, récupération optimale, mental d'acier."
            },
            'default': {
                1: "🎉 21 jours ! L'habitude commence à s'ancrer dans ton quotidien. Le plus dur est passé, continue !",
                2: "🌟 3 mois ! L'habitude devient automatique. Ton cerveau a créé de nouvelles connexions neuronales.",
                3: "💪 6 mois ! Tu ne te poses plus la question. Cette habitude fait partie de ton identité.",
                4: "🏆 9 mois ! Intégration totale. Cette habitude est devenue une seconde nature, inscrite dans ton être."
            }
        };
        
        let selectedEmoji = '🌱';
        
        function loadHabits() {
            return JSON.parse(localStorage.getItem('wutree_new_habits') || '[]');
        }
        
        function saveHabits(habits) {
            localStorage.setItem('wutree_new_habits', JSON.stringify(habits));
        }
        
        function getDaysSince(startDate) {
            const start = new Date(startDate);
            const today = new Date();
            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return Math.max(0, diffDays);
        }
        
        function getCurrentLevel(days) {
            for (let i = LEVELS.length - 1; i >= 0; i--) {
                if (days >= LEVELS[i].days) {
                    return { level: i + 1, ...LEVELS[i] };
                }
            }
            return { level: 0, days: 21, icon: '🌱', name: 'Germination', color: 'level-1' };
        }
        
        function getNextLevel(days) {
            for (let i = 0; i < LEVELS.length; i++) {
                if (days < LEVELS[i].days) {
                    return LEVELS[i];
                }
            }
            return LEVELS[LEVELS.length - 1];
        }
        
        function getProgress(days) {
            const nextLevel = getNextLevel(days);
            const prevLevelDays = LEVELS.findIndex(l => l.days === nextLevel.days) > 0 
                ? LEVELS[LEVELS.findIndex(l => l.days === nextLevel.days) - 1].days 
                : 0;
            
            if (days >= LEVELS[LEVELS.length - 1].days) {
                return 100;
            }
            
            const progress = ((days - prevLevelDays) / (nextLevel.days - prevLevelDays)) * 100;
            return Math.min(100, Math.max(0, progress));
        }
        
        function getBenefitsMessage(habitName, level) {
            const messages = BENEFITS_MESSAGES[habitName] || BENEFITS_MESSAGES['default'];
            return messages[level] || messages['default'][level];
        }
        
        function renderHabits() {
            const habits = loadHabits();
            const container = document.getElementById('habitsContainer');
            
            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🌱</div>
                        <div class="empty-text">Aucune habitude en cours<br>Commence à en créer une !</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = habits.map(habit => {
                const days = getDaysSince(habit.startDate);
                const currentLevel = getCurrentLevel(days);
                const nextLevel = getNextLevel(days);
                const progress = getProgress(days);
                const daysToNext = nextLevel.days - days;
                
                const startDateFormatted = new Date(habit.startDate).toLocaleDateString('fr-FR', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                
                return `
                    <div class="habit-card">
                        <div class="habit-header">
                            <div class="habit-emoji">${habit.emoji}</div>
                            <div class="habit-info">
                                <div class="habit-name">${habit.name}</div>
                                <div class="habit-start">Depuis le ${startDateFormatted}</div>
                            </div>
                            <button class="habit-delete" onclick="deleteHabit('${habit.id}')">×</button>
                        </div>
                        
                        <div class="habit-progress">
                            <div class="progress-header">
                                <div class="progress-level" onclick="showBenefits('${habit.name}', ${currentLevel.level})">
                                    <span class="progress-level-icon">${currentLevel.icon}</span>
                                    <span class="progress-level-name">${currentLevel.name}</span>
                                </div>
                                <div class="progress-days">${days} jour${days > 1 ? 's' : ''}</div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${currentLevel.color}" style="width: ${progress}%"></div>
                            </div>
                            <div class="milestones">
                                ${LEVELS.map(l => `
                                    <span class="milestone ${days >= l.days ? 'reached' : ''}">${l.icon}</span>
                                `).join('')}
                            </div>
                        </div>
                        
                        ${days < LEVELS[LEVELS.length - 1].days ? `
                            <div style="text-align: center; font-size: 11px; color: rgba(0,0,0,0.5); margin-top: 8px;">
                                ${daysToNext} jour${daysToNext > 1 ? 's' : ''} avant ${nextLevel.icon} ${nextLevel.name}
                            </div>
                        ` : `
                            <div class="habit-benefits">
                                <div class="benefits-title">🏆 Habitude intégrée !</div>
                                <div class="benefits-text">Cette habitude fait maintenant partie de ton identité.</div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }
        
        function showBenefits(habitName, level) {
            if (level === 0) return;
            
            const message = getBenefitsMessage(habitName, level);
            document.getElementById('benefitsTitle').textContent = `${LEVELS[level - 1].icon} Niveau ${level} atteint !`;
            document.getElementById('benefitsContent').innerHTML = `
                <div style="font-size: 14px; line-height: 1.6; color: #333;">
                    ${message}
                </div>
            `;
            document.getElementById('benefitsModal').classList.add('show');
        }
        
        function closeBenefitsModal() {
            document.getElementById('benefitsModal').classList.remove('show');
        }
        
        function openAddModal() {
            document.getElementById('habitName').value = '';
            document.getElementById('habitStartDate').value = new Date().toISOString().split('T')[0];
            selectedEmoji = '🌱';
            renderEmojiGrid();
            document.getElementById('addModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('addModal').classList.remove('show');
        }
        
        function renderEmojiGrid() {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = HABIT_EMOJIS.map(emoji => `
                <button class="emoji-option ${emoji === selectedEmoji ? 'selected' : ''}" 
                        onclick="selectEmoji('${emoji}')">${emoji}</button>
            `).join('');
        }
        
        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            renderEmojiGrid();
        }
        
        function saveHabit() {
            const name = document.getElementById('habitName').value.trim();
            const startDate = document.getElementById('habitStartDate').value;
            
            if (!name) {
                alert('Donne un nom à ton habitude !');
                return;
            }
            
            if (!startDate) {
                alert('Choisis une date de début !');
                return;
            }
            
            const habits = loadHabits();
            habits.push({
                id: 'habit_' + Date.now(),
                name,
                emoji: selectedEmoji,
                startDate,
                createdAt: new Date().toISOString()
            });
            
            saveHabits(habits);
            closeModal();
            renderHabits();
        }
        
        function deleteHabit(habitId) {
            if (!confirm('Supprimer cette habitude ?')) return;
            
            let habits = loadHabits();
            habits = habits.filter(h => h.id !== habitId);
            saveHabits(habits);
            renderHabits();
        }
        
        // Navigation
        function goBack() {
            window.location.href = 'wu-tree-v2-home.html';
        }
        
        function goToVision() {
            window.location.href = 'wu-tree-v2-visualization.html';
        }
        
        function goToTasks() {
            window.location.href = 'wu-tree-v2-tasks.html';
        }
        
        // Init
        renderHabits();
        renderEmojiGrid();
    </script>
</body>
</html>
