<!DOCTYPE html>
<!-- Wu Tree Activity v2.1 - 17 avril 2026 -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Activité</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 10px 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        
        .back-btn {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #333;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-content { flex: 1; }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-subtitle {
            font-size: 11px;
            color: rgba(0,0,0,0.5);
            margin-top: 3px;
        }
        
        .content {
            padding: 0 20px 100px;
            height: calc(100% - 120px);
            overflow-y: auto;
            position: relative;
            z-index: 50;
        }
        
        .section { margin-bottom: 25px; }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .section-title { font-size: 14px; font-weight: 700; color: #333; }
        
        .section-add {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            font-size: 18px;
            color: #6B4E9B;
            cursor: pointer;
        }
        
        /* OBJECTIFS */
        .objective-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .objective-card:active {
            transform: scale(0.98);
        }
        
        .objective-header { display: flex; align-items: center; gap: 12px; }
        .objective-emoji { font-size: 28px; }
        .objective-content { flex: 1; }
        .objective-name { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .objective-deadline { font-size: 11px; color: #6B4E9B; font-weight: 600; }
        .objective-sessions { font-size: 10px; color: rgba(0,0,0,0.5); margin-top: 2px; }
        
        .objective-arrow {
            font-size: 20px;
            color: rgba(0,0,0,0.3);
            font-weight: 300;
        }
        
        .objective-progress { margin-top: 10px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.5); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6B4E9B, #9B6B9B); border-radius: 3px; }
        .progress-text { font-size: 10px; color: rgba(0,0,0,0.5); margin-top: 4px; text-align: right; }
        
        .objective-card.completed { background: rgba(76, 175, 80, 0.2); border-color: rgba(76, 175, 80, 0.4); }
        .objective-card.completed .objective-name { text-decoration: line-through; opacity: 0.7; }
        
        /* HABITUDES */
        .habits-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0 15px;
            -webkit-overflow-scrolling: touch;
        }
        .habits-scroll::-webkit-scrollbar { display: none; }
        
        .habit-bubble {
            min-width: 85px; width: 85px; height: 85px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            position: relative;
            flex-shrink: 0;
        }
        
        .habit-bubble:active { transform: scale(0.95); }
        .habit-bubble.done-today { background: rgba(76, 175, 80, 0.3); border-color: rgba(76, 175, 80, 0.5); }
        
        .habit-bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 25%; height: 15%;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            filter: blur(3px);
        }
        
        .habit-emoji { font-size: 28px; margin-bottom: 4px; }
        .habit-name { font-size: 8px; font-weight: 600; color: #333; text-align: center; max-width: 70px; }
        
        .habit-streak {
            position: absolute;
            bottom: -5px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            color: #333;
        }
        
        .habit-bubble.add-habit {
            background: rgba(255, 255, 255, 0.25);
            border: 3px dashed rgba(255, 255, 255, 0.5);
        }
        .habit-bubble.add-habit .habit-emoji { opacity: 0.5; }
        
        /* TÂCHES */
        .task-item {
            background: rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        .task-item:active { transform: scale(0.98); }
        
        .task-checkbox {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(107, 78, 155, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: transparent;
            flex-shrink: 0;
        }
        
        .task-item.completed .task-checkbox { background: #4CAF50; border-color: #4CAF50; color: white; }
        .task-content { flex: 1; }
        .task-name { font-size: 13px; font-weight: 500; color: #333; }
        .task-item.completed .task-name { text-decoration: line-through; opacity: 0.6; }
        .task-due { font-size: 10px; color: #6B4E9B; margin-top: 2px; }
        
        .empty-section { text-align: center; padding: 20px; color: rgba(0,0,0,0.4); font-size: 12px; }
        
        /* PROGRAMME */
        .program-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 15px;
        }
        
        .program-days {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .program-day {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .program-day.active {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border-color: #6B4E9B;
            color: white;
        }
        
        .program-day.done {
            background: rgba(76, 175, 80, 0.5);
            border-color: rgba(76, 175, 80, 0.6);
            color: white;
        }
        
        .program-info {
            text-align: center;
            font-size: 11px;
            color: rgba(0,0,0,0.5);
        }
        
        .program-info strong {
            color: #6B4E9B;
        }
        
        /* MINI CALENDRIER */
        .calendar-mini {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 16px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .calendar-month {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .calendar-nav {
            display: flex;
            gap: 8px;
        }
        
        .calendar-nav button {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }
        
        .calendar-nav-btn {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }
        
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        
        .calendar-weekday {
            text-align: center;
            font-size: 9px;
            color: rgba(0,0,0,0.4);
            font-weight: 600;
        }
        
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: rgba(0,0,0,0.5);
            border-radius: 50%;
            position: relative;
        }
        
        .calendar-day.other-month {
            opacity: 0.3;
        }
        
        .calendar-day.today {
            font-weight: 700;
            color: #333;
        }
        
        .calendar-day.planned {
            background: rgba(107, 78, 155, 0.2);
            color: #6B4E9B;
            font-weight: 600;
        }
        
        .calendar-day.done {
            background: rgba(76, 175, 80, 0.5);
            color: white;
            font-weight: 600;
        }
        
        .calendar-day.missed {
            background: rgba(244, 67, 54, 0.2);
            color: #c62828;
        }
        
        .calendar-legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 12px;
            font-size: 9px;
            color: rgba(0,0,0,0.5);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        
        .legend-dot.planned { background: rgba(107, 78, 155, 0.4); }
        .legend-dot.done { background: rgba(76, 175, 80, 0.5); }
        .legend-dot.missed { background: rgba(244, 67, 54, 0.3); }
        
        /* MODALS */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        
        .modal {
            width: 90%;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        
        .modal-title { flex: 1; font-size: 16px; font-weight: 600; color: #333; }
        .modal-close { width: 32px; height: 32px; background: rgba(255,255,255,0.4); border: none; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .modal-content { padding: 20px; }
        
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 11px; color: rgba(0,0,0,0.6); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
        .input-field { width: 100%; padding: 12px 14px; border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; font-size: 14px; font-family: 'Comfortaa', sans-serif; background: rgba(255,255,255,0.4); color: #333; }
        .input-field:focus { outline: none; border-color: #6B4E9B; }
        
        .emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; }
        .emoji-option { width: 40px; height: 40px; background: rgba(255,255,255,0.4); border: 2px solid transparent; border-radius: 10px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .emoji-option.selected { border-color: #6B4E9B; background: rgba(255,255,255,0.7); }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 14px; font-family: 'Comfortaa', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #6B4E9B, #9B6B9B); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.5); color: #333; }
        
        /* Rating stars */
        .rating-container {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .rating-star {
            font-size: 28px;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
        }
        
        .rating-star.active {
            opacity: 1;
        }
        
        .rating-star:hover {
            transform: scale(1.2);
        }
        
        /* Textarea */
        .input-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            font-size: 13px;
            font-family: 'Comfortaa', sans-serif;
            background: rgba(255,255,255,0.4);
            color: #333;
            resize: none;
            min-height: 70px;
        }
        
        .input-textarea:focus { outline: none; border-color: #6B4E9B; }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 90;
        }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 16px; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-content">
                <div class="header-title">
                    <span id="activityEmoji">🏋️</span>
                    <span id="activityName">Sport</span>
                </div>
                <div class="header-subtitle" id="headerSubtitle">💪 Santé</div>
            </div>
        </div>
        
        <div class="content">
            <!-- OBJECTIFS -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">🎯 Objectifs</div>
                    <button class="section-add" onclick="openModal('objective')">+</button>
                </div>
                <div id="objectivesContainer"></div>
            </div>
            
            <!-- HABITUDES -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">🌱 Habitudes</div>
                    <button class="section-add" onclick="openModal('habit')">+</button>
                </div>
                <div class="habits-scroll" id="habitsContainer"></div>
            </div>
            
            <!-- TÂCHES -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">✓ Tâches</div>
                    <button class="section-add" onclick="openModal('task')">+</button>
                </div>
                <div id="tasksContainer"></div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToVision()">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item active">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Arbre</div>
            </div>
            <div class="menu-item" onclick="goToTasks()">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
        
        <!-- Modal Objectif -->
        <div class="modal-overlay" id="objectiveModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">🎯 Nouvel objectif</div>
                    <button class="modal-close" onclick="closeModal('objective')">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Objectif</label>
                        <input type="text" class="input-field" id="objectiveName" placeholder="Ex: Refaire des pompes">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Deadline</label>
                        <input type="date" class="input-field" id="objectiveDeadline">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-picker" id="objectiveEmojis"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal('objective')">Annuler</button>
                        <button class="btn btn-primary" onclick="saveObjective()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal Habitude -->
        <div class="modal-overlay" id="habitModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">🌱 Nouvelle habitude</div>
                    <button class="modal-close" onclick="closeModal('habit')">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Habitude</label>
                        <input type="text" class="input-field" id="habitName" placeholder="Ex: 30 min de sport">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-picker" id="habitEmojis"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal('habit')">Annuler</button>
                        <button class="btn btn-primary" onclick="saveHabit()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal Tâche -->
        <div class="modal-overlay" id="taskModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">✓ Nouvelle tâche</div>
                    <button class="modal-close" onclick="closeModal('task')">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Tâche</label>
                        <input type="text" class="input-field" id="taskName" placeholder="Ex: Acheter des haltères">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Échéance (optionnel)</label>
                        <input type="date" class="input-field" id="taskDue">
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal('task')">Annuler</button>
                        <button class="btn btn-primary" onclick="saveTask()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal Séance -->
        <div class="modal-overlay" id="sessionModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">📝 Nouvelle séance</div>
                    <button class="modal-close" onclick="closeModal('session')">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Date</label>
                        <input type="date" class="input-field" id="sessionDate">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Exercices réalisés</label>
                        <textarea class="input-textarea" id="sessionExercises" placeholder="Ex: 2x15 pompes, 2x8 tractions, 1x20 abdos..."></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Comment ça s'est passé ?</label>
                        <input type="hidden" id="sessionRating" value="3">
                        <div class="rating-container">
                            <span class="rating-star active" onclick="setRating(1)">⭐</span>
                            <span class="rating-star active" onclick="setRating(2)">⭐</span>
                            <span class="rating-star active" onclick="setRating(3)">⭐</span>
                            <span class="rating-star" onclick="setRating(4)">⭐</span>
                            <span class="rating-star" onclick="setRating(5)">⭐</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Notes (optionnel)</label>
                        <textarea class="input-textarea" id="sessionNotes" placeholder="Ressenti, difficultés, progrès..."></textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal('session')">Annuler</button>
                        <button class="btn btn-primary" onclick="saveSession()">Enregistrer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const currentActivityId = localStorage.getItem('wutree_current_activity') || '';
        const currentDomainId = localStorage.getItem('wutree_current_domain') || 'sante';
        
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        
        const DAYS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
        const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        
        const OBJECTIVE_EMOJIS = ['🎯', '💪', '🏆', '⭐', '🚀', '📈', '✨', '🔥', '💎', '🌟'];
        const HABIT_EMOJIS = ['🏋️', '🧘', '🏃', '🥗', '💊', '😴', '🚿', '⏰', '💧', '📖', '✍️', '🧠'];
        
        function init() {
            loadActivityInfo();
            renderObjectives();
            renderHabits();
            renderTasks();
            setupEmojiPickers();
        }
        
        function loadActivityInfo() {
            const activities = JSON.parse(localStorage.getItem('wutree_activities') || '[]');
            const activity = activities.find(a => a.id === currentActivityId);
            
            const domains = JSON.parse(localStorage.getItem('wutree_domains') || '[]');
            const domain = domains.find(d => d.id === currentDomainId);
            
            if (activity) {
                document.getElementById('activityEmoji').textContent = activity.emoji;
                document.getElementById('activityName').textContent = activity.name;
            }
            
            if (domain) {
                document.getElementById('headerSubtitle').textContent = `${domain.emoji} ${domain.name}`;
            }
        }
        
        // ========== PROGRAMME ==========
        function getProgram() {
            const programs = JSON.parse(localStorage.getItem('wutree_programs') || '[]');
            return programs.find(p => p.activityId === currentActivityId) || { activityId: currentActivityId, days: [] };
        }
        
        function saveProgram(program) {
            let programs = JSON.parse(localStorage.getItem('wutree_programs') || '[]');
            programs = programs.filter(p => p.activityId !== currentActivityId);
            programs.push(program);
            localStorage.setItem('wutree_programs', JSON.stringify(programs));
        }
        
        function getCompletedSessions() {
            return JSON.parse(localStorage.getItem('wutree_activity_sessions') || '[]')
                .filter(s => s.activityId === currentActivityId);
        }
        
        function saveSession(date) {
            let sessions = JSON.parse(localStorage.getItem('wutree_activity_sessions') || '[]');
            const existing = sessions.find(s => s.activityId === currentActivityId && s.date === date);
            
            if (existing) {
                sessions = sessions.filter(s => !(s.activityId === currentActivityId && s.date === date));
            } else {
                sessions.push({ activityId: currentActivityId, date, completedAt: new Date().toISOString() });
            }
            
            localStorage.setItem('wutree_activity_sessions', JSON.stringify(sessions));
        }
        
        function renderProgram() {
            const program = getProgram();
            const today = new Date().getDay(); // 0 = dimanche
            const todayIndex = today === 0 ? 6 : today - 1; // Convertir en index L=0, D=6
            
            const completedSessions = getCompletedSessions();
            const todayStr = new Date().toISOString().split('T')[0];
            const doneToday = completedSessions.some(s => s.date === todayStr);
            
            const container = document.getElementById('programDays');
            container.innerHTML = DAYS.map((day, i) => {
                let classes = 'program-day';
                if (program.days.includes(i)) classes += ' active';
                if (i === todayIndex && doneToday) classes += ' done';
                
                return `<div class="${classes}" onclick="toggleProgramDay(${i})">${day}</div>`;
            }).join('');
            
            // Info
            const sessionsPerWeek = program.days.length;
            const info = document.getElementById('programInfo');
            if (sessionsPerWeek === 0) {
                info.innerHTML = 'Clique sur les jours pour planifier tes séances';
            } else {
                info.innerHTML = `<strong>${sessionsPerWeek}x</strong> par semaine`;
            }
        }
        
        function toggleProgramDay(dayIndex) {
            const program = getProgram();
            if (program.days.includes(dayIndex)) {
                program.days = program.days.filter(d => d !== dayIndex);
            } else {
                program.days.push(dayIndex);
                program.days.sort();
            }
            saveProgram(program);
            renderProgram();
            renderCalendar();
        }
        
        // ========== CALENDRIER ==========
        function renderCalendar() {
            const program = getProgram();
            const completedSessions = getCompletedSessions();
            const completedDates = completedSessions.map(s => s.date);
            
            document.getElementById('calendarMonth').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
            
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // Adjust for Monday start
            let startDay = firstDay.getDay() - 1;
            if (startDay < 0) startDay = 6;
            
            const container = document.getElementById('calendarDays');
            let html = '';
            
            // Previous month days
            const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${prevMonthLastDay - i}</div>`;
            }
            
            // Current month days
            for (let d = 1; d <= lastDay.getDate(); d++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const date = new Date(currentYear, currentMonth, d);
                const dayOfWeek = date.getDay();
                const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                
                const isPlanned = program.days.includes(dayIndex);
                const isDone = completedDates.includes(dateStr);
                const isPast = date < today && dateStr !== todayStr;
                const isToday = dateStr === todayStr;
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                
                if (isDone) {
                    classes += ' done';
                } else if (isPlanned && isPast) {
                    classes += ' missed';
                } else if (isPlanned) {
                    classes += ' planned';
                }
                
                html += `<div class="${classes}" onclick="toggleSession('${dateStr}')">${d}</div>`;
            }
            
            // Next month days
            const totalCells = Math.ceil((startDay + lastDay.getDate()) / 7) * 7;
            const remaining = totalCells - startDay - lastDay.getDate();
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="calendar-day other-month">${i}</div>`;
            }
            
            container.innerHTML = html;
        }
        
        function toggleSession(dateStr) {
            saveSession(dateStr);
            renderProgram();
            renderCalendar();
        }
        
        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }
        
        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        }
        
        function setupEmojiPickers() {
            document.getElementById('objectiveEmojis').innerHTML = OBJECTIVE_EMOJIS.map((e, i) => 
                `<div class="emoji-option ${i === 0 ? 'selected' : ''}" onclick="selectEmoji(this)">${e}</div>`
            ).join('');
            
            document.getElementById('habitEmojis').innerHTML = HABIT_EMOJIS.map((e, i) => 
                `<div class="emoji-option ${i === 0 ? 'selected' : ''}" onclick="selectEmoji(this)">${e}</div>`
            ).join('');
        }
        
        function selectEmoji(el) {
            el.parentElement.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        // ========== OBJECTIFS ==========
        function getObjectives() {
            return JSON.parse(localStorage.getItem('wutree_objectives') || '[]').filter(o => o.activityId === currentActivityId);
        }
        
        function saveObjectives(objectives) {
            const all = JSON.parse(localStorage.getItem('wutree_objectives') || '[]').filter(o => o.activityId !== currentActivityId);
            localStorage.setItem('wutree_objectives', JSON.stringify([...all, ...objectives]));
        }
        
        function renderObjectives() {
            const container = document.getElementById('objectivesContainer');
            const objectives = getObjectives();
            
            if (objectives.length === 0) {
                container.innerHTML = '<div class="empty-section">Aucun objectif. Clique + pour en ajouter.</div>';
                return;
            }
            
            container.innerHTML = objectives.map(obj => {
                const deadline = new Date(obj.deadline);
                const today = new Date();
                const total = Math.ceil((deadline - new Date(obj.createdAt)) / (1000 * 60 * 60 * 24));
                const remaining = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
                const progress = Math.max(0, Math.min(100, ((total - remaining) / total) * 100));
                const deadlineStr = deadline.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                
                // Count sessions
                const sessions = JSON.parse(localStorage.getItem('wutree_objective_sessions_templates') || '[]')
                    .filter(s => s.objectiveId === obj.id);
                const sessionsCount = sessions.length;
                
                return `
                    <div class="objective-card ${obj.completed ? 'completed' : ''}" onclick="openObjective('${obj.id}')">
                        <div class="objective-header">
                            <div class="objective-emoji">${obj.emoji}</div>
                            <div class="objective-content">
                                <div class="objective-name">${obj.name}</div>
                                <div class="objective-deadline">📅 ${deadlineStr} ${remaining > 0 ? `(${remaining}j)` : ''}</div>
                                ${sessionsCount > 0 ? `<div class="objective-sessions">🏋️ ${sessionsCount} séance${sessionsCount > 1 ? 's' : ''}/sem</div>` : ''}
                            </div>
                            <div class="objective-arrow">›</div>
                        </div>
                        <div class="objective-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${obj.completed ? 100 : progress}%"></div>
                            </div>
                            <div class="progress-text">${obj.completed ? '✓ Complété' : `${Math.round(progress)}%`}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function openObjective(objectiveId) {
            // DEBUG: Affiche une alerte pour confirmer
            alert('Redirection vers objectif: ' + objectiveId);
            
            localStorage.setItem('wutree_current_objective', objectiveId);
            
            // Redirection explicite vers la page objectif
            const targetUrl = 'wu-tree-v2-objective.html';
            console.log('Navigating to:', targetUrl);
            window.location.href = targetUrl;
        }
        
        function saveObjective() {
            const name = document.getElementById('objectiveName').value.trim();
            const deadline = document.getElementById('objectiveDeadline').value;
            const emoji = document.querySelector('#objectiveEmojis .selected')?.textContent || '🎯';
            
            if (!name || !deadline) { alert('Remplis tous les champs !'); return; }
            
            const objectives = getObjectives();
            objectives.push({ 
                id: 'obj_' + Date.now(), 
                activityId: currentActivityId, 
                domainId: currentDomainId,
                name, 
                deadline, 
                emoji, 
                completed: false,
                weekProgram: {},
                createdAt: new Date().toISOString() 
            });
            saveObjectives(objectives);
            closeModal('objective');
            document.getElementById('objectiveName').value = '';
            document.getElementById('objectiveDeadline').value = '';
            renderObjectives();
        }
        
        // ========== HABITUDES ==========
        function getHabits() {
            return JSON.parse(localStorage.getItem('wutree_domain_habits') || '[]').filter(h => h.activityId === currentActivityId);
        }
        
        function saveHabits(habits) {
            const all = JSON.parse(localStorage.getItem('wutree_domain_habits') || '[]').filter(h => h.activityId !== currentActivityId);
            localStorage.setItem('wutree_domain_habits', JSON.stringify([...all, ...habits]));
        }
        
        function renderHabits() {
            const container = document.getElementById('habitsContainer');
            const habits = getHabits();
            const today = new Date().toISOString().split('T')[0];
            
            let html = habits.map(habit => {
                const doneToday = habit.completedDays?.includes(today);
                const streak = calculateStreak(habit.completedDays || []);
                const streakHtml = streak > 0 ? `<div class="habit-streak">🔥${streak}</div>` : '';
                
                return `
                    <div class="habit-bubble ${doneToday ? 'done-today' : ''}" onclick="toggleHabit('${habit.id}')">
                        <div class="habit-emoji">${habit.emoji}</div>
                        <div class="habit-name">${habit.name}</div>
                        ${streakHtml}
                    </div>
                `;
            }).join('');
            
            html += `<div class="habit-bubble add-habit" onclick="openModal('habit')"><div class="habit-emoji">+</div></div>`;
            container.innerHTML = html;
        }
        
        function calculateStreak(completedDays) {
            if (!completedDays?.length) return 0;
            const sorted = [...completedDays].sort().reverse();
            const today = new Date().toISOString().split('T')[0];
            let streak = 0, checkDate = new Date();
            if (sorted[0] !== today) checkDate.setDate(checkDate.getDate() - 1);
            for (let i = 0; i < 365; i++) {
                const dateStr = checkDate.toISOString().split('T')[0];
                if (sorted.includes(dateStr)) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
                else break;
            }
            return streak;
        }
        
        function toggleHabit(id) {
            const habits = getHabits();
            const habit = habits.find(h => h.id === id);
            const today = new Date().toISOString().split('T')[0];
            if (!habit.completedDays) habit.completedDays = [];
            if (habit.completedDays.includes(today)) habit.completedDays = habit.completedDays.filter(d => d !== today);
            else habit.completedDays.push(today);
            saveHabits(habits);
            renderHabits();
        }
        
        function saveHabit() {
            const name = document.getElementById('habitName').value.trim();
            const emoji = document.querySelector('#habitEmojis .selected')?.textContent || '🌱';
            if (!name) { alert('Entre un nom !'); return; }
            const habits = getHabits();
            habits.push({ 
                id: 'habit_' + Date.now(), 
                activityId: currentActivityId, 
                domainId: currentDomainId,
                name, 
                emoji, 
                completedDays: [], 
                createdAt: new Date().toISOString() 
            });
            saveHabits(habits);
            closeModal('habit');
            document.getElementById('habitName').value = '';
            renderHabits();
        }
        
        // ========== TÂCHES ==========
        function getTasks() {
            return JSON.parse(localStorage.getItem('wutree_domain_tasks') || '[]').filter(t => t.activityId === currentActivityId);
        }
        
        function saveTasks(tasks) {
            const all = JSON.parse(localStorage.getItem('wutree_domain_tasks') || '[]').filter(t => t.activityId !== currentActivityId);
            localStorage.setItem('wutree_domain_tasks', JSON.stringify([...all, ...tasks]));
        }
        
        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const tasks = getTasks().sort((a, b) => a.completed - b.completed);
            
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-section">Aucune tâche. Clique + pour en ajouter.</div>';
                return;
            }
            
            container.innerHTML = tasks.map(task => {
                const dueHtml = task.due ? `<div class="task-due">📅 ${new Date(task.due).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</div>` : '';
                return `
                    <div class="task-item ${task.completed ? 'completed' : ''}" onclick="toggleTask('${task.id}')">
                        <div class="task-checkbox">✓</div>
                        <div class="task-content">
                            <div class="task-name">${task.name}</div>
                            ${dueHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleTask(id) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (task) { task.completed = !task.completed; saveTasks(tasks); renderTasks(); }
        }
        
        function saveTask() {
            const name = document.getElementById('taskName').value.trim();
            const due = document.getElementById('taskDue').value;
            if (!name) { alert('Entre un nom !'); return; }
            const tasks = getTasks();
            tasks.push({ 
                id: 'task_' + Date.now(), 
                activityId: currentActivityId, 
                domainId: currentDomainId,
                name, 
                due: due || null, 
                completed: false, 
                createdAt: new Date().toISOString() 
            });
            saveTasks(tasks);
            closeModal('task');
            document.getElementById('taskName').value = '';
            document.getElementById('taskDue').value = '';
            renderTasks();
        }
        
        // ========== MODALS ==========
        function openModal(type) { document.getElementById(type + 'Modal').classList.add('show'); }
        function closeModal(type) { document.getElementById(type + 'Modal').classList.remove('show'); }
        
        // ========== NAV ==========
        function goBack() { window.location.href = 'wu-tree-v2-domain.html'; }
        function goToVision() { window.location.href = 'wu-tree-v2-visualization.html'; }
        function goToTasks() { window.location.href = 'wu-tree-v2-tasks.html'; }
        
        init();
    </script>
</body>
</html>
