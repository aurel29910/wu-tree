<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree - Niveau</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .phone-frame {
            width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        .cloud { position: absolute; color: white; font-size: 40px; opacity: 0.5;
            animation: float-cloud linear infinite; pointer-events: none; z-index: 40; }
        .cloud:nth-child(6) { top: 100px; animation-duration: 200s; }
        @keyframes float-cloud { 0% { transform: translateX(-80px); } 100% { transform: translateX(455px); } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        .header { position: absolute; top: 44px; left: 0; right: 0; height: 55px;
            display: flex; align-items: center; padding: 0 15px; z-index: 90;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .back-button { width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: white; border: 2px solid rgba(255, 255, 255, 0.5); }
        .back-button:active { transform: scale(0.95); }
        .header-title { flex: 1; text-align: center; font-family: 'Comfortaa', cursive;
            font-size: 18px; font-weight: 600; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-emoji { font-size: 26px; }
        .header-spacer { width: 36px; }
        
        .date-banner { position: absolute; top: 99px; left: 0; right: 0; height: 40px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px; color: white; z-index: 85; }
        .date-icon { font-size: 16px; }
        
        .content { position: absolute; top: 139px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 15px 20px; z-index: 60; }
        
        .intention-section { margin-bottom: 20px; }
        .section-label { font-size: 11px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px;
            display: flex; align-items: center; gap: 6px; }
        .intention-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 14px; padding: 14px; border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; transition: all 0.3s; }
        .intention-card:active { transform: scale(0.98); }
        .intention-text { font-size: 14px; color: white; font-style: italic; line-height: 1.5; }
        .intention-empty { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
        
        .stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 18px; }
        .stat { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 10px 18px; text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3); }
        .stat-number { font-size: 22px; font-weight: 700; color: white; }
        .stat-label { font-size: 9px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; margin-top: 2px; }
        
        .actions-section { margin-top: 20px; }
        
        .action-item { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.4); transition: all 0.3s; }
        .action-item.completed { opacity: 0.6; }
        .action-item.completed .action-title { text-decoration: line-through; }
        .action-item.overdue { border-color: rgba(255, 107, 107, 0.6); }
        
        .action-top { display: flex; align-items: center; gap: 10px; }
        .action-checkbox { width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.7); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            background: rgba(255, 255, 255, 0.2); transition: all 0.3s; flex-shrink: 0; }
        .action-checkbox.checked { background: rgba(255, 255, 255, 0.8); border-color: white; }
        .action-checkbox::after { content: '✓'; color: #B4A7D6; font-size: 12px;
            font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .action-checkbox.checked::after { opacity: 1; }
        
        .action-content { flex: 1; cursor: pointer; }
        .action-title { font-size: 14px; color: white; font-weight: 500; line-height: 1.3; }
        .action-meta { display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
        .action-due { font-size: 11px; color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 10px;
            display: flex; align-items: center; gap: 4px; }
        .action-due.overdue { background: rgba(255, 107, 107, 0.5); color: white; }
        .action-due.today { background: rgba(255, 193, 7, 0.5); color: white; }
        .action-due.soon { background: rgba(76, 175, 80, 0.4); color: white; }
        .action-subtasks { font-size: 11px; color: rgba(255, 255, 255, 0.7);
            display: flex; align-items: center; gap: 4px; }
        
        .action-arrow { font-size: 16px; color: rgba(255, 255, 255, 0.6); }
        
        .empty-state { text-align: center; padding: 50px 20px; }
        .empty-icon { font-size: 50px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: rgba(255, 255, 255, 0.8); line-height: 1.6; }
        
        .fab { position: absolute; bottom: 90px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white; font-size: 32px; font-weight: 300;
            cursor: pointer; box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .fab:active { transform: scale(0.95); }
        
        .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 200; display: none;
            align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        
        .modal { width: 100%; background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px 24px 0 0; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            padding-bottom: 30px; }
        
        .modal-header { padding: 14px 20px; background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .modal-icon { font-size: 22px; }
        .modal-title { flex: 1; font-family: 'Comfortaa', cursive; font-size: 15px;
            font-weight: 600; color: white; }
        .modal-close { width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; color: white; border: 2px solid rgba(255, 255, 255, 0.5); }
        
        .modal-content { padding: 16px 20px; }
        
        .input-group { margin-bottom: 14px; }
        .input-label { display: block; font-size: 11px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
        .input-field { width: 100%; padding: 12px 14px; border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px; font-size: 14px; background: rgba(255, 255, 255, 0.3);
            color: white; }
        .input-field:focus { outline: none; border-color: rgba(255, 255, 255, 0.7); }
        .input-field::placeholder { color: rgba(255,255,255,0.5); }
        
        .submit-btn { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 14px; color: #B4A7D6;
            font-family: 'Comfortaa', cursive; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px; }
        .submit-btn:active { transform: scale(0.98); }
        
        .bottom-menu { position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 90; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 8px 20px; border-radius: 12px; transition: all 0.3s; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(74, 90, 79, 0.8); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <div class="back-button" onclick="goBack()">←</div>
            <div class="header-title">
                <span class="header-emoji" id="headerEmoji">💧</span>
                <span id="headerName">Aujourd'hui</span>
            </div>
            <div class="header-spacer"></div>
        </div>
        
        <div class="date-banner">
            <span class="date-icon">📅</span>
            <span id="dateBanner">Échéance : Aujourd'hui</span>
        </div>
        
        <div class="content" id="content"></div>
        
        <button class="fab" onclick="openAddModal()">+</button>
        
        <div class="modal-overlay" id="addModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-icon">🎯</div>
                    <div class="modal-title">Nouvel objectif</div>
                    <div class="modal-close" onclick="closeAddModal()">×</div>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Titre de l'objectif</label>
                        <input type="text" class="input-field" id="actionInput" placeholder="Ex: Finaliser le business plan">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Échéance</label>
                        <input type="date" class="input-field" id="dueDateInput">
                    </div>
                    <button class="submit-btn" onclick="addAction()">Ajouter</button>
                </div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToTree()"><div class="menu-icon">📅</div><div class="menu-label">Arbre</div></div>
            <div class="menu-item active"><div class="menu-icon">✅</div><div class="menu-label">Actions</div></div>
        </div>
    </div>
    
    <script>
        const ALL_LEVELS = [
            { id: 'year', icon: '🌱', name: 'Année' },
            { id: 'semester', icon: '🌿', name: 'Semestre' },
            { id: 'quarter', icon: '🍃', name: 'Trimestre' },
            { id: 'month', icon: '🍂', name: 'Mois' },
            { id: 'week', icon: '🌾', name: 'Semaine' },
            { id: 'today', icon: '💧', name: "Aujourd'hui" }
        ];
        
        let currentSubproject = null;
        let currentLevelId = null;
        let treeData = {};
        
        function init() {
            currentLevelId = localStorage.getItem('wutree_current_level');
            const subprojectId = localStorage.getItem('wutree_current_subproject');
            const projectId = localStorage.getItem('wutree_current_project');
            
            if (!currentLevelId || !subprojectId || !projectId) {
                window.location.href = 'wu-tree-v2-subproject-tree.html';
                return;
            }
            
            const projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            const project = projects.find(p => p.id === projectId);
            if (!project) { window.location.href = 'wu-tree-v2-home.html'; return; }
            
            currentSubproject = project.subprojects?.find(sp => sp.id === subprojectId);
            if (!currentSubproject) { window.location.href = 'wu-tree-v2-project-domain.html'; return; }
            
            treeData = currentSubproject.tree || {};
            
            const level = ALL_LEVELS.find(l => l.id === currentLevelId);
            if (level) {
                document.getElementById('headerEmoji').textContent = level.icon;
                document.getElementById('headerName').textContent = level.name;
            }
            
            // Définir l'échéance par défaut selon le niveau
            const defaultDue = getDefaultDueDate(currentLevelId);
            document.getElementById('dueDateInput').value = formatDateForInput(defaultDue);
            document.getElementById('dateBanner').textContent = `Échéance : ${formatDateDisplay(defaultDue)}`;
            
            renderContent();
        }
        
        function getDefaultDueDate(levelId) {
            const today = new Date();
            switch(levelId) {
                case 'today':
                    return today;
                case 'week':
                    const endOfWeek = new Date(today);
                    endOfWeek.setDate(today.getDate() + (7 - today.getDay()));
                    return endOfWeek;
                case 'month':
                    return new Date(today.getFullYear(), today.getMonth() + 1, 0);
                case 'quarter':
                    const quarter = Math.floor(today.getMonth() / 3);
                    return new Date(today.getFullYear(), (quarter + 1) * 3, 0);
                case 'semester':
                    const semester = today.getMonth() < 6 ? 0 : 1;
                    return new Date(today.getFullYear(), (semester + 1) * 6, 0);
                case 'year':
                    return new Date(today.getFullYear(), 11, 31);
                default:
                    return today;
            }
        }
        
        function formatDateForInput(date) {
            return date.toISOString().split('T')[0];
        }
        
        function formatDateDisplay(date) {
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            return date.toLocaleDateString('fr-FR', options);
        }
        
        function getDueStatus(dueDate) {
            if (!dueDate) return { class: '', text: '' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            due.setHours(0, 0, 0, 0);
            
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return { class: 'overdue', text: `En retard (${Math.abs(diffDays)}j)`, icon: '⚠️' };
            } else if (diffDays === 0) {
                return { class: 'today', text: "Aujourd'hui", icon: '🔥' };
            } else if (diffDays <= 3) {
                return { class: 'soon', text: `Dans ${diffDays}j`, icon: '⏰' };
            } else {
                return { class: '', text: formatDateDisplay(due), icon: '📅' };
            }
        }
        
        function renderContent() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const content = document.getElementById('content');
            
            const completedCount = levelData.actions.filter(a => a.completed).length;
            const totalCount = levelData.actions.length;
            
            let html = '';
            
            if (totalCount > 0) {
                html += `
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-number">${completedCount}</div>
                            <div class="stat-label">Terminées</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${totalCount - completedCount}</div>
                            <div class="stat-label">En cours</div>
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="intention-section">
                    <div class="section-label">✨ Intention</div>
                    <div class="intention-card" onclick="editIntention()">
                        ${levelData.intention ? 
                            `<div class="intention-text">"${levelData.intention}"</div>` :
                            `<div class="intention-empty">Définir une intention...</div>`
                        }
                    </div>
                </div>
            `;
            
            html += `<div class="actions-section">`;
            html += `<div class="section-label">🎯 Objectifs & Actions</div>`;
            
            if (levelData.actions.length === 0) {
                html += `
                    <div class="empty-state">
                        <div class="empty-icon">🌱</div>
                        <div class="empty-text">Aucun objectif pour le moment.<br>Clique sur + pour en ajouter !</div>
                    </div>
                `;
            } else {
                const sortedActions = [...levelData.actions].sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
                    return 0;
                });
                
                sortedActions.forEach((action, idx) => {
                    const realIndex = levelData.actions.findIndex(a => a.id === action.id);
                    const dueStatus = getDueStatus(action.dueDate);
                    const subtaskCount = action.subtasks ? action.subtasks.length : 0;
                    const subtaskDone = action.subtasks ? action.subtasks.filter(s => s.completed).length : 0;
                    
                    html += `
                        <div class="action-item ${action.completed ? 'completed' : ''} ${dueStatus.class === 'overdue' && !action.completed ? 'overdue' : ''}">
                            <div class="action-top">
                                <div class="action-checkbox ${action.completed ? 'checked' : ''}" onclick="event.stopPropagation(); toggleAction('${action.id}')"></div>
                                <div class="action-content" onclick="openActionDetail('${action.id}')">
                                    <div class="action-title">${action.text}</div>
                                    <div class="action-meta">
                                        ${action.dueDate ? `<span class="action-due ${dueStatus.class}">${dueStatus.icon} ${dueStatus.text}</span>` : ''}
                                        ${subtaskCount > 0 ? `<span class="action-subtasks">☑️ ${subtaskDone}/${subtaskCount}</span>` : ''}
                                    </div>
                                </div>
                                <div class="action-arrow" onclick="openActionDetail('${action.id}')">›</div>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += `</div>`;
            content.innerHTML = html;
        }
        
        function editIntention() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const newIntention = prompt('Intention pour ce niveau :', levelData.intention || '');
            
            if (newIntention !== null) {
                if (!treeData[currentLevelId]) treeData[currentLevelId] = { intention: '', actions: [] };
                treeData[currentLevelId].intention = newIntention.trim();
                saveTree();
                renderContent();
            }
        }
        
        function openAddModal() {
            const defaultDue = getDefaultDueDate(currentLevelId);
            document.getElementById('dueDateInput').value = formatDateForInput(defaultDue);
            document.getElementById('addModal').classList.add('show');
            document.getElementById('actionInput').focus();
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            document.getElementById('actionInput').value = '';
        }
        
        function addAction() {
            const text = document.getElementById('actionInput').value.trim();
            const dueDate = document.getElementById('dueDateInput').value;
            
            if (!text) { alert('Entre un objectif !'); return; }
            
            if (!treeData[currentLevelId]) treeData[currentLevelId] = { intention: '', actions: [] };
            
            treeData[currentLevelId].actions.push({
                id: Date.now().toString(),
                text: text,
                description: '',
                dueDate: dueDate,
                completed: false,
                subtasks: [],
                notes: '',
                createdAt: new Date().toISOString()
            });
            
            saveTree();
            closeAddModal();
            renderContent();
        }
        
        function toggleAction(actionId) {
            const action = treeData[currentLevelId].actions.find(a => a.id === actionId);
            if (action) {
                action.completed = !action.completed;
                saveTree();
                renderContent();
            }
        }
        
        function openActionDetail(actionId) {
            localStorage.setItem('wutree_current_action', actionId);
            window.location.href = 'wu-tree-v2-action-detail.html';
        }
        
        function saveTree() {
            const projectId = localStorage.getItem('wutree_current_project');
            let projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            const projectIndex = projects.findIndex(p => p.id === projectId);
            if (projectIndex === -1) return;
            
            const subprojectIndex = projects[projectIndex].subprojects.findIndex(sp => sp.id === currentSubproject.id);
            if (subprojectIndex === -1) return;
            
            projects[projectIndex].subprojects[subprojectIndex].tree = treeData;
            localStorage.setItem('wutree_projects', JSON.stringify(projects));
        }
        
        function goBack() { window.location.href = 'wu-tree-v2-subproject-tree.html'; }
        function goToTree() { window.location.href = 'wu-tree-v2-subproject-tree.html'; }
        
        document.getElementById('actionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addAction();
        });
        
        init();
    </script>
</body>
</html>
