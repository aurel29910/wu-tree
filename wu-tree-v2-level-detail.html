<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree - Détail</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .phone-frame {
            width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        /* Pétales */
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        /* Nuages */
        .cloud { position: absolute; color: white; font-size: 40px; opacity: 0.5;
            animation: float-cloud linear infinite; pointer-events: none; z-index: 40; }
        .cloud:nth-child(6) { top: 100px; animation-duration: 200s; }
        @keyframes float-cloud { 0% { transform: translateX(-80px); } 100% { transform: translateX(455px); } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        /* Header */
        .header { position: absolute; top: 44px; left: 0; right: 0; height: 55px;
            display: flex; align-items: center; padding: 0 15px; z-index: 90;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .back-button { width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: white; border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s; }
        .back-button:active { transform: scale(0.95); }
        .header-title { flex: 1; text-align: center; font-family: 'Comfortaa', cursive;
            font-size: 18px; font-weight: 600; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-emoji { font-size: 26px; }
        .header-spacer { width: 36px; }
        
        /* Contenu */
        .content { position: absolute; top: 99px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 20px; z-index: 60; }
        
        /* Section intention */
        .intention-section { margin-bottom: 20px; }
        .section-label { font-size: 12px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; }
        .intention-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 16px; border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; transition: all 0.3s; }
        .intention-card:hover { background: rgba(255, 255, 255, 0.4); }
        .intention-card:active { transform: scale(0.98); }
        .intention-text { font-size: 15px; color: white; font-style: italic; line-height: 1.5; }
        .intention-empty { font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        
        /* Section actions/objectifs */
        .actions-section { margin-top: 25px; }
        
        .action-item { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4); transition: all 0.3s; }
        .action-item.completed { opacity: 0.6; }
        .action-item.completed .action-text { text-decoration: line-through; }
        
        .action-checkbox { width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.7); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            background: rgba(255, 255, 255, 0.2); transition: all 0.3s; flex-shrink: 0; }
        .action-checkbox.checked { background: rgba(255, 255, 255, 0.8); border-color: white; }
        .action-checkbox::after { content: '✓'; color: #B4A7D6; font-size: 14px;
            font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .action-checkbox.checked::after { opacity: 1; }
        
        .action-text { flex: 1; font-size: 15px; color: white; line-height: 1.4; }
        
        .action-delete { width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 107, 107, 0.7); color: white; font-size: 18px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.5); opacity: 0; transition: all 0.3s; flex-shrink: 0; }
        .action-item:hover .action-delete { opacity: 1; }
        .action-delete:active { transform: scale(0.9); }
        
        /* État vide */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 60px; margin-bottom: 15px; }
        .empty-text { font-size: 15px; color: rgba(255, 255, 255, 0.8); line-height: 1.6; }
        
        /* Statistiques */
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .stat { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 12px 20px; text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3); }
        .stat-number { font-size: 24px; font-weight: 700; color: white; }
        .stat-label { font-size: 10px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; margin-top: 2px; }
        
        /* FAB rose */
        .fab { position: absolute; bottom: 90px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white; font-size: 32px; font-weight: 300;
            cursor: pointer; box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }
        
        /* Modal ajout action */
        .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 200; display: none;
            align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        
        .modal { width: 100%; background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px 24px 0 0; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            padding-bottom: 30px; }
        
        .modal-header { padding: 16px 20px; background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .modal-icon { font-size: 24px; }
        .modal-title { flex: 1; font-family: 'Comfortaa', cursive; font-size: 16px;
            font-weight: 600; color: white; }
        .modal-close { width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: white; border: 2px solid rgba(255, 255, 255, 0.5); }
        
        .modal-content { padding: 20px; }
        
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
        .input-field { width: 100%; padding: 14px 16px; border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px; font-size: 15px; background: rgba(255, 255, 255, 0.3);
            color: white; }
        .input-field:focus { outline: none; border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.4); }
        .input-field::placeholder { color: rgba(255,255,255,0.5); }
        
        .submit-btn { width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 14px; color: #B4A7D6;
            font-family: 'Comfortaa', cursive; font-size: 16px; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 10px; }
        .submit-btn:active { transform: scale(0.98); }
        
        /* Bottom menu */
        .bottom-menu { position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 90; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 8px 20px; border-radius: 12px; transition: all 0.3s; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(74, 90, 79, 0.8); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Pétales -->
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <!-- Nuages -->
        <div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <div class="back-button" onclick="goBack()">←</div>
            <div class="header-title">
                <span class="header-emoji" id="headerEmoji">💧</span>
                <span id="headerName">Aujourd'hui</span>
            </div>
            <div class="header-spacer"></div>
        </div>
        
        <div class="content" id="content">
            <!-- Contenu dynamique -->
        </div>
        
        <!-- FAB rose -->
        <button class="fab" onclick="openAddModal()">+</button>
        
        <!-- Modal ajout action -->
        <div class="modal-overlay" id="addModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-icon">🎯</div>
                    <div class="modal-title">Nouvelle action</div>
                    <div class="modal-close" onclick="closeAddModal()">×</div>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Action / Objectif</label>
                        <input type="text" class="input-field" id="actionInput" placeholder="Que veux-tu accomplir ?">
                    </div>
                    <button class="submit-btn" onclick="addAction()">Ajouter</button>
                </div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToTree()"><div class="menu-icon">📅</div><div class="menu-label">Arbre</div></div>
            <div class="menu-item active"><div class="menu-icon">✅</div><div class="menu-label">Actions</div></div>
        </div>
    </div>
    
    <script>
        const ALL_LEVELS = [
            { id: 'year', icon: '🌱', name: 'Année' },
            { id: 'semester', icon: '🌿', name: 'Semestre' },
            { id: 'quarter', icon: '🍃', name: 'Trimestre' },
            { id: 'month', icon: '🍂', name: 'Mois' },
            { id: 'week', icon: '🌾', name: 'Semaine' },
            { id: 'today', icon: '💧', name: "Aujourd'hui" }
        ];
        
        let currentSubproject = null;
        let currentLevelId = null;
        let treeData = {};
        
        function init() {
            currentLevelId = localStorage.getItem('wutree_current_level');
            const subprojectId = localStorage.getItem('wutree_current_subproject');
            const projectId = localStorage.getItem('wutree_current_project');
            
            if (!currentLevelId || !subprojectId || !projectId) {
                window.location.href = 'wu-tree-v2-subproject-tree.html';
                return;
            }
            
            const projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            const project = projects.find(p => p.id === projectId);
            if (!project) {
                window.location.href = 'wu-tree-v2-home.html';
                return;
            }
            
            currentSubproject = project.subprojects?.find(sp => sp.id === subprojectId);
            if (!currentSubproject) {
                window.location.href = 'wu-tree-v2-project-domain.html';
                return;
            }
            
            treeData = currentSubproject.tree || {};
            
            const level = ALL_LEVELS.find(l => l.id === currentLevelId);
            if (level) {
                document.getElementById('headerEmoji').textContent = level.icon;
                document.getElementById('headerName').textContent = level.name;
            }
            
            renderContent();
        }
        
        function renderContent() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const content = document.getElementById('content');
            
            const completedCount = levelData.actions.filter(a => a.completed).length;
            const totalCount = levelData.actions.length;
            
            let html = '';
            
            // Statistiques
            if (totalCount > 0) {
                html += `
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-number">${completedCount}</div>
                            <div class="stat-label">Terminées</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${totalCount - completedCount}</div>
                            <div class="stat-label">En cours</div>
                        </div>
                    </div>
                `;
            }
            
            // Section intention
            html += `
                <div class="intention-section">
                    <div class="section-label">✨ Intention</div>
                    <div class="intention-card" onclick="editIntention()">
                        ${levelData.intention ? 
                            `<div class="intention-text">"${levelData.intention}"</div>` :
                            `<div class="intention-empty">Définir une intention pour ce niveau...</div>`
                        }
                    </div>
                </div>
            `;
            
            // Section actions
            html += `<div class="actions-section">`;
            html += `<div class="section-label">🎯 Actions & Objectifs</div>`;
            
            if (levelData.actions.length === 0) {
                html += `
                    <div class="empty-state">
                        <div class="empty-icon">🌱</div>
                        <div class="empty-text">Aucune action pour le moment.<br>Clique sur + pour en ajouter une !</div>
                    </div>
                `;
            } else {
                // Trier : non complétées en premier
                const sortedActions = [...levelData.actions].sort((a, b) => {
                    if (a.completed === b.completed) return 0;
                    return a.completed ? 1 : -1;
                });
                
                sortedActions.forEach((action, originalIndex) => {
                    // Retrouver l'index original
                    const realIndex = levelData.actions.findIndex(a => a.text === action.text && a.completed === action.completed);
                    
                    html += `
                        <div class="action-item ${action.completed ? 'completed' : ''}" data-index="${realIndex}">
                            <div class="action-checkbox ${action.completed ? 'checked' : ''}" onclick="toggleAction(${realIndex})"></div>
                            <div class="action-text">${action.text}</div>
                            <div class="action-delete" onclick="deleteAction(${realIndex})">×</div>
                        </div>
                    `;
                });
            }
            
            html += `</div>`;
            
            content.innerHTML = html;
        }
        
        function editIntention() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const newIntention = prompt('Intention pour ce niveau :', levelData.intention || '');
            
            if (newIntention !== null) {
                if (!treeData[currentLevelId]) {
                    treeData[currentLevelId] = { intention: '', actions: [] };
                }
                treeData[currentLevelId].intention = newIntention.trim();
                saveTree();
                renderContent();
            }
        }
        
        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
            document.getElementById('actionInput').focus();
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            document.getElementById('actionInput').value = '';
        }
        
        function addAction() {
            const input = document.getElementById('actionInput');
            const text = input.value.trim();
            
            if (!text) {
                alert('Entre une action !');
                return;
            }
            
            if (!treeData[currentLevelId]) {
                treeData[currentLevelId] = { intention: '', actions: [] };
            }
            
            treeData[currentLevelId].actions.push({
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            });
            
            saveTree();
            closeAddModal();
            renderContent();
        }
        
        function toggleAction(index) {
            if (treeData[currentLevelId] && treeData[currentLevelId].actions[index]) {
                treeData[currentLevelId].actions[index].completed = !treeData[currentLevelId].actions[index].completed;
                saveTree();
                renderContent();
            }
        }
        
        function deleteAction(index) {
            if (confirm('Supprimer cette action ?')) {
                treeData[currentLevelId].actions.splice(index, 1);
                saveTree();
                renderContent();
            }
        }
        
        function saveTree() {
            const projectId = localStorage.getItem('wutree_current_project');
            let projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            const projectIndex = projects.findIndex(p => p.id === projectId);
            if (projectIndex === -1) return;
            
            const subprojectIndex = projects[projectIndex].subprojects.findIndex(sp => sp.id === currentSubproject.id);
            if (subprojectIndex === -1) return;
            
            projects[projectIndex].subprojects[subprojectIndex].tree = treeData;
            localStorage.setItem('wutree_projects', JSON.stringify(projects));
        }
        
        function goBack() { window.location.href = 'wu-tree-v2-subproject-tree.html'; }
        function goToTree() { window.location.href = 'wu-tree-v2-subproject-tree.html'; }
        
        // Entrée pour ajouter action
        document.getElementById('actionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addAction();
        });
        
        init();
    </script>
</body>
</html>
