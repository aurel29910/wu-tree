<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Tree - Niveau</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .phone-frame {
            width: 375px; height: 812px;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        .petal { position: absolute; width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0; animation: fall linear infinite; pointer-events: none; z-index: 50; }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 50%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 70%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 3s; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(812px) rotate(360deg); opacity: 0; } }
        
        .cloud { position: absolute; color: white; font-size: 40px; opacity: 0.5;
            animation: float-cloud linear infinite; pointer-events: none; z-index: 40; }
        .cloud:nth-child(6) { top: 100px; animation-duration: 200s; }
        @keyframes float-cloud { 0% { transform: translateX(-80px); } 100% { transform: translateX(455px); } }
        
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: rgba(255,255,255,0.95); font-size: 14px; z-index: 100; }
        
        .header { position: absolute; top: 44px; left: 0; right: 0; height: 55px;
            display: flex; align-items: center; padding: 0 15px; z-index: 90;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .back-button { width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: white; border: 2px solid rgba(255, 255, 255, 0.5); }
        .back-button:active { transform: scale(0.95); }
        .header-title { flex: 1; text-align: center; font-family: 'Comfortaa', cursive;
            font-size: 18px; font-weight: 600; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-emoji { font-size: 26px; }
        .header-spacer { width: 36px; }
        
        .date-selector { position: absolute; top: 99px; left: 0; right: 0; height: 50px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            background: rgba(255, 255, 255, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.2); z-index: 85; }
        .date-arrow { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 16px; color: white; border: 2px solid rgba(255, 255, 255, 0.4); }
        .date-arrow:active { transform: scale(0.95); }
        .date-display { font-size: 14px; color: white; font-weight: 600; min-width: 180px; text-align: center;
            cursor: pointer; padding: 6px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.2); }
        
        .content { position: absolute; top: 149px; left: 0; right: 0; bottom: 70px;
            overflow-y: auto; padding: 15px 20px; z-index: 60; }
        
        .intention-section { margin-bottom: 15px; }
        .section-label { font-size: 11px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
        .intention-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 14px; padding: 14px; border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; transition: all 0.3s; }
        .intention-card:active { transform: scale(0.98); }
        .intention-text { font-size: 14px; color: white; font-style: italic; line-height: 1.5; }
        .intention-empty { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
        
        .stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .stat { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 10px 18px; text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3); }
        .stat-number { font-size: 22px; font-weight: 700; color: white; }
        .stat-label { font-size: 9px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; margin-top: 2px; }
        
        .actions-section { margin-top: 15px; }
        
        .task-item { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            border-radius: 0 14px 14px 0; padding: 12px 14px; margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.4); border-left: 4px solid white;
            transition: all 0.3s; position: relative; }
        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-title { text-decoration: line-through; }
        
        .task-top { display: flex; align-items: flex-start; gap: 10px; }
        .task-checkbox { width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.7); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            background: rgba(255, 255, 255, 0.2); transition: all 0.3s; flex-shrink: 0; margin-top: 2px; }
        .task-checkbox.checked { background: rgba(255, 255, 255, 0.8); border-color: white; }
        .task-checkbox::after { content: '✓'; color: #B4A7D6; font-size: 12px;
            font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .task-checkbox.checked::after { opacity: 1; }
        
        .task-content { flex: 1; cursor: pointer; }
        .task-title { font-size: 14px; color: white; font-weight: 500; line-height: 1.3; }
        .task-details { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 4px; 
            line-height: 1.4; white-space: pre-wrap; }
        .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .task-due { font-size: 10px; color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 10px; }
        .task-due.overdue { background: rgba(255, 107, 107, 0.5); }
        .task-due.today { background: rgba(255, 193, 7, 0.5); }
        .task-due.soon { background: rgba(76, 175, 80, 0.4); }
        .task-subtasks { font-size: 10px; color: rgba(255, 255, 255, 0.8); }
        .task-link { font-size: 9px; color: rgba(255, 255, 255, 0.9); background: rgba(255,255,255,0.25);
            padding: 2px 6px; border-radius: 8px; }
        
        .empty-state { text-align: center; padding: 50px 20px; }
        .empty-icon { font-size: 50px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: rgba(255, 255, 255, 0.8); line-height: 1.6; }
        
        .fab { position: absolute; bottom: 90px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white; font-size: 32px; font-weight: 300;
            cursor: pointer; box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .fab:active { transform: scale(0.95); }
        
        .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 200; display: none;
            align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { width: 100%; background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px 24px 0 0; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            max-height: 85%; display: flex; flex-direction: column; }
        .modal-header { padding: 14px 20px; background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); flex-shrink: 0; }
        .modal-icon { font-size: 22px; }
        .modal-title { flex: 1; font-family: 'Comfortaa', cursive; font-size: 15px; font-weight: 600; color: white; }
        .modal-close { width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; color: white; border: 2px solid rgba(255, 255, 255, 0.5); }
        .modal-content { padding: 16px 20px; overflow-y: auto; padding-bottom: 30px; }
        .input-group { margin-bottom: 14px; }
        .input-label { display: block; font-size: 11px; color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
        .input-field { width: 100%; padding: 11px 12px; border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px; font-size: 14px; background: rgba(255, 255, 255, 0.3); color: white; }
        .input-field:focus { outline: none; border-color: rgba(255, 255, 255, 0.7); }
        .input-field::placeholder { color: rgba(255,255,255,0.5); }
        textarea.input-field { min-height: 80px; resize: vertical; font-family: inherit; }
        .submit-btn { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 14px; color: #B4A7D6;
            font-family: 'Comfortaa', cursive; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .submit-btn:active { transform: scale(0.98); }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 14px; border: none; border-radius: 14px;
            font-family: 'Comfortaa', cursive; font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; }
        .action-btn.edit { background: rgba(255, 255, 255, 0.9); color: #B4A7D6; }
        .action-btn.delete { background: rgba(255, 107, 107, 0.8); color: white; }
        .action-btn:active { transform: scale(0.98); }
        
        .calendar { background: rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 12px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-title { font-size: 14px; color: white; font-weight: 600; }
        .calendar-nav { display: flex; gap: 8px; }
        .calendar-nav-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 12px; color: white; border: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-header { font-size: 10px; color: rgba(255,255,255,0.7); text-align: center; padding: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: white; border-radius: 50%; cursor: pointer; transition: all 0.2s; }
        .calendar-day:hover { background: rgba(255,255,255,0.3); }
        .calendar-day.other-month { color: rgba(255,255,255,0.4); }
        .calendar-day.today { border: 2px solid rgba(255,255,255,0.6); }
        .calendar-day.selected { background: rgba(255,255,255,0.6); font-weight: 700; }
        .calendar-day.has-tasks { position: relative; }
        .calendar-day.has-tasks::after { content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px;
            background: #FF69B4; border-radius: 50%; }
        
        .bottom-menu { position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 90; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 8px 16px; border-radius: 12px; transition: all 0.3s; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(74, 90, 79, 0.8); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <div class="back-button" onclick="goBack()">←</div>
            <div class="header-title">
                <span class="header-emoji" id="levelEmoji">💧</span>
                <span id="levelName">Aujourd'hui</span>
            </div>
            <div class="header-spacer"></div>
        </div>
        
        <div class="date-selector">
            <div class="date-arrow" onclick="previousPeriod()">‹</div>
            <div class="date-display" id="dateDisplay" onclick="openCalendarModal()">Aujourd'hui</div>
            <div class="date-arrow" onclick="nextPeriod()">›</div>
        </div>
        
        <div class="content" id="content"></div>
        
        <button class="fab" onclick="openAddModal()">+</button>
        
        <!-- Modal ajout -->
        <div class="modal-overlay" id="addModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-icon">🎯</div>
                    <div class="modal-title">Nouvel objectif</div>
                    <div class="modal-close" onclick="closeAddModal()">×</div>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Titre</label>
                        <input type="text" class="input-field" id="actionInput" placeholder="Ex: Séance de sport">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Détails (actions à réaliser)</label>
                        <textarea class="input-field" id="detailsInput" placeholder="Ex:&#10;- 20 min cardio&#10;- 30 min musculation&#10;- Étirements"></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Date</label>
                        <input type="date" class="input-field" id="dueDateInput">
                    </div>
                    <button class="submit-btn" onclick="addAction()">✨ Ajouter</button>
                </div>
            </div>
        </div>
        
        <!-- Modal édition/suppression -->
        <div class="modal-overlay" id="editModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-icon">✏️</div>
                    <div class="modal-title">Modifier l'objectif</div>
                    <div class="modal-close" onclick="closeEditModal()">×</div>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Titre</label>
                        <input type="text" class="input-field" id="editTitleInput">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Détails (actions à réaliser)</label>
                        <textarea class="input-field" id="editDetailsInput"></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Date</label>
                        <input type="date" class="input-field" id="editDueDateInput">
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn delete" onclick="deleteAction()">🗑️ Supprimer</button>
                        <button class="action-btn edit" onclick="saveEdit()">💾 Enregistrer</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal calendrier -->
        <div class="modal-overlay" id="calendarModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-icon">📅</div>
                    <div class="modal-title">Choisir une date</div>
                    <div class="modal-close" onclick="closeCalendarModal()">×</div>
                </div>
                <div class="modal-content">
                    <div class="calendar" id="calendarContainer"></div>
                </div>
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToValues()"><div class="menu-icon">🏛️</div><div class="menu-label">Fondations</div></div>
            <div class="menu-item" onclick="goToHome()"><div class="menu-icon">🌳</div><div class="menu-label">Arbre</div></div>
            <div class="menu-item" onclick="goToTasks()"><div class="menu-icon">📋</div><div class="menu-label">Tâches</div></div>
            <div class="menu-item" onclick="goToRoots()"><div class="menu-icon">🌿</div><div class="menu-label">Racines</div></div>
        </div>
    </div>
    
    <script>
        const LEVEL_INFO = {
            'today': { icon: '💧', name: "Aujourd'hui", order: 0 },
            'week': { icon: '🌾', name: 'Semaine', order: 1 },
            'month': { icon: '🍂', name: 'Mois', order: 2 },
            'quarter': { icon: '🍃', name: 'Trimestre', order: 3 },
            'semester': { icon: '🌿', name: 'Semestre', order: 4 },
            'year': { icon: '🌱', name: 'Année', order: 5 }
        };
        
        let currentLevelId = '';
        let currentSubproject = null;
        let currentProject = null;
        let treeData = {};
        let selectedDate = new Date();
        let calendarDate = new Date();
        let longPressTimer = null;
        let editingActionId = null;
        
        function init() {
            const projectId = localStorage.getItem('wutree_current_project');
            const subprojectId = localStorage.getItem('wutree_current_subproject');
            currentLevelId = localStorage.getItem('wutree_current_level') || 'today';
            
            const projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            currentProject = projects.find(p => p.id === projectId);
            if (!currentProject) { goBack(); return; }
            
            currentSubproject = currentProject.subprojects?.find(sp => sp.id === subprojectId);
            if (!currentSubproject) { goBack(); return; }
            
            treeData = currentSubproject.tree || {};
            
            const level = LEVEL_INFO[currentLevelId];
            document.getElementById('levelEmoji').textContent = level.icon;
            document.getElementById('levelName').textContent = level.name;
            
            updateDateDisplay();
            renderContent();
        }
        
        function getPeriodBounds(levelId, date) {
            const d = new Date(date);
            let start, end;
            
            switch(levelId) {
                case 'today':
                    start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                    end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
                    break;
                case 'week':
                    const dayOfWeek = d.getDay();
                    const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    start = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMonday);
                    end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    end.setHours(23, 59, 59);
                    break;
                case 'month':
                    start = new Date(d.getFullYear(), d.getMonth(), 1);
                    end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
                    break;
                case 'quarter':
                    const q = Math.floor(d.getMonth() / 3);
                    start = new Date(d.getFullYear(), q * 3, 1);
                    end = new Date(d.getFullYear(), (q + 1) * 3, 0, 23, 59, 59);
                    break;
                case 'semester':
                    const s = d.getMonth() < 6 ? 0 : 1;
                    start = new Date(d.getFullYear(), s * 6, 1);
                    end = new Date(d.getFullYear(), (s + 1) * 6, 0, 23, 59, 59);
                    break;
                case 'year':
                    start = new Date(d.getFullYear(), 0, 1);
                    end = new Date(d.getFullYear(), 11, 31, 23, 59, 59);
                    break;
                default:
                    start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                    end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
            }
            return { start, end };
        }
        
        function updateDateDisplay() {
            const display = document.getElementById('dateDisplay');
            const today = new Date();
            const period = getPeriodBounds(currentLevelId, selectedDate);
            const opts = { day: 'numeric', month: 'short' };
            
            let text = '';
            switch(currentLevelId) {
                case 'today':
                    text = isSameDay(selectedDate, today) ? "Aujourd'hui" : 
                           selectedDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
                    break;
                case 'week':
                    text = `${period.start.toLocaleDateString('fr-FR', opts)} - ${period.end.toLocaleDateString('fr-FR', opts)}`;
                    break;
                case 'month':
                    text = selectedDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
                    break;
                case 'quarter':
                    text = `T${Math.floor(selectedDate.getMonth() / 3) + 1} ${selectedDate.getFullYear()}`;
                    break;
                case 'semester':
                    text = `S${selectedDate.getMonth() < 6 ? 1 : 2} ${selectedDate.getFullYear()}`;
                    break;
                case 'year':
                    text = `Année ${selectedDate.getFullYear()}`;
                    break;
            }
            display.textContent = text;
        }
        
        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        }
        
        function previousPeriod() {
            switch(currentLevelId) {
                case 'today': selectedDate.setDate(selectedDate.getDate() - 1); break;
                case 'week': selectedDate.setDate(selectedDate.getDate() - 7); break;
                case 'month': selectedDate.setMonth(selectedDate.getMonth() - 1); break;
                case 'quarter': selectedDate.setMonth(selectedDate.getMonth() - 3); break;
                case 'semester': selectedDate.setMonth(selectedDate.getMonth() - 6); break;
                case 'year': selectedDate.setFullYear(selectedDate.getFullYear() - 1); break;
            }
            updateDateDisplay();
            renderContent();
        }
        
        function nextPeriod() {
            switch(currentLevelId) {
                case 'today': selectedDate.setDate(selectedDate.getDate() + 1); break;
                case 'week': selectedDate.setDate(selectedDate.getDate() + 7); break;
                case 'month': selectedDate.setMonth(selectedDate.getMonth() + 1); break;
                case 'quarter': selectedDate.setMonth(selectedDate.getMonth() + 3); break;
                case 'semester': selectedDate.setMonth(selectedDate.getMonth() + 6); break;
                case 'year': selectedDate.setFullYear(selectedDate.getFullYear() + 1); break;
            }
            updateDateDisplay();
            renderContent();
        }
        
        function getTasksForPeriod() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const period = getPeriodBounds(currentLevelId, selectedDate);
            
            return levelData.actions.filter(action => {
                if (!action.dueDate) return false;
                const taskDate = new Date(action.dueDate);
                return taskDate >= period.start && taskDate <= period.end;
            });
        }
        
        function getDueStatus(dueDate) {
            if (!dueDate) return { class: '', text: '', icon: '' };
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { class: 'overdue', text: `${Math.abs(diffDays)}j retard`, icon: '⚠️' };
            if (diffDays === 0) return { class: 'today', text: "Aujourd'hui", icon: '🔥' };
            if (diffDays <= 3) return { class: 'soon', text: `${diffDays}j`, icon: '⏰' };
            return { class: '', text: `${diffDays}j`, icon: '📅' };
        }
        
        function renderContent() {
            const content = document.getElementById('content');
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const filteredActions = getTasksForPeriod();
            
            const projectColor = currentProject.color || '#FFFFFF';
            const pendingActions = filteredActions.filter(a => !a.completed);
            const completedActions = filteredActions.filter(a => a.completed);
            
            let html = '';
            
            html += `<div class="intention-section">
                <div class="section-label">✨ Intention</div>
                <div class="intention-card" onclick="editIntention()">
                    ${levelData.intention ? 
                        `<div class="intention-text">"${levelData.intention}"</div>` :
                        `<div class="intention-empty">Définir une intention...</div>`}
                </div>
            </div>`;
            
            const total = filteredActions.length;
            const done = completedActions.length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            
            html += `<div class="stats">
                <div class="stat"><div class="stat-number">${pendingActions.length}</div><div class="stat-label">À faire</div></div>
                <div class="stat"><div class="stat-number">${done}</div><div class="stat-label">Terminées</div></div>
                <div class="stat"><div class="stat-number">${percent}%</div><div class="stat-label">Progression</div></div>
            </div>`;
            
            html += `<div class="actions-section"><div class="section-label">🎯 Objectifs</div>`;
            
            if (filteredActions.length === 0) {
                html += `<div class="empty-state">
                    <div class="empty-icon">🌱</div>
                    <div class="empty-text">Aucun objectif pour cette période.<br>Clique sur + pour en ajouter !</div>
                </div>`;
            } else {
                const sortedActions = [...filteredActions].sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    return 0;
                });
                
                sortedActions.forEach(action => {
                    const dueStatus = getDueStatus(action.dueDate);
                    const subtaskCount = action.subtasks?.length || 0;
                    const subtaskDone = action.subtasks?.filter(s => s.completed).length || 0;
                    const hasDetails = action.description && action.description.trim();
                    const linkedInfo = action.linkedToWeekObjective ? `<span class="task-link">🔗 Lié</span>` : '';
                    
                    html += `<div class="task-item ${action.completed ? 'completed' : ''}" 
                         data-action-id="${action.id}"
                         style="border-left-color: ${projectColor};"
                         onmousedown="startLongPress('${action.id}')"
                         onmouseup="cancelLongPress()"
                         onmouseleave="cancelLongPress()"
                         ontouchstart="startLongPress('${action.id}')"
                         ontouchend="cancelLongPress()">
                        <div class="task-top">
                            <div class="task-checkbox ${action.completed ? 'checked' : ''}" 
                                 onclick="event.stopPropagation(); toggleAction('${action.id}')"></div>
                            <div class="task-content" onclick="openActionDetail('${action.id}')">
                                <div class="task-title">${action.text}</div>
                                ${hasDetails ? `<div class="task-details">${action.description}</div>` : ''}
                                <div class="task-meta">
                                    ${action.dueDate ? `<span class="task-due ${dueStatus.class}">${dueStatus.icon} ${dueStatus.text}</span>` : ''}
                                    ${subtaskCount > 0 ? `<span class="task-subtasks">☑️ ${subtaskDone}/${subtaskCount}</span>` : ''}
                                    ${linkedInfo}
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
            }
            
            html += `</div>`;
            content.innerHTML = html;
        }
        
        function startLongPress(actionId) {
            longPressTimer = setTimeout(() => {
                navigator.vibrate && navigator.vibrate(50);
                openEditModal(actionId);
            }, 600);
        }
        
        function cancelLongPress() {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }
        
        function openEditModal(actionId) {
            cancelLongPress();
            editingActionId = actionId;
            
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const action = levelData.actions.find(a => a.id === actionId);
            if (!action) return;
            
            document.getElementById('editTitleInput').value = action.text;
            document.getElementById('editDetailsInput').value = action.description || '';
            document.getElementById('editDueDateInput').value = action.dueDate || '';
            
            document.getElementById('editModal').classList.add('show');
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingActionId = null;
        }
        
        function saveEdit() {
            if (!editingActionId) return;
            
            const title = document.getElementById('editTitleInput').value.trim();
            const details = document.getElementById('editDetailsInput').value.trim();
            const dueDate = document.getElementById('editDueDateInput').value;
            
            if (!title) { alert('Entre un titre !'); return; }
            
            const action = treeData[currentLevelId].actions.find(a => a.id === editingActionId);
            if (action) {
                action.text = title;
                action.description = details;
                action.dueDate = dueDate;
                saveTree();
            }
            
            closeEditModal();
            renderContent();
        }
        
        function deleteAction() {
            if (!editingActionId) return;
            if (!confirm('Supprimer cet objectif ?')) return;
            
            const idx = treeData[currentLevelId].actions.findIndex(a => a.id === editingActionId);
            if (idx > -1) {
                treeData[currentLevelId].actions.splice(idx, 1);
                saveTree();
            }
            
            closeEditModal();
            renderContent();
        }
        
        function editIntention() {
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const newIntention = prompt('Intention pour ce niveau :', levelData.intention || '');
            
            if (newIntention !== null) {
                if (!treeData[currentLevelId]) treeData[currentLevelId] = { intention: '', actions: [] };
                treeData[currentLevelId].intention = newIntention.trim();
                saveTree();
                renderContent();
            }
        }
        
        function openAddModal() {
            document.getElementById('dueDateInput').value = formatDateForInput(selectedDate);
            document.getElementById('actionInput').value = '';
            document.getElementById('detailsInput').value = '';
            document.getElementById('addModal').classList.add('show');
            document.getElementById('actionInput').focus();
        }
        
        function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
        
        function addAction() {
            const text = document.getElementById('actionInput').value.trim();
            const details = document.getElementById('detailsInput').value.trim();
            const dueDate = document.getElementById('dueDateInput').value;
            
            if (!text) { alert('Entre un objectif !'); return; }
            
            if (!treeData[currentLevelId]) treeData[currentLevelId] = { intention: '', actions: [] };
            
            treeData[currentLevelId].actions.push({
                id: Date.now().toString(),
                text: text,
                description: details,
                dueDate: dueDate,
                completed: false,
                subtasks: [],
                notes: '',
                createdAt: new Date().toISOString()
            });
            
            saveTree();
            closeAddModal();
            renderContent();
        }
        
        function toggleAction(actionId) {
            const action = treeData[currentLevelId].actions.find(a => a.id === actionId);
            if (action) {
                action.completed = !action.completed;
                action.completedAt = action.completed ? new Date().toISOString() : null;
                saveTree();
                renderContent();
            }
        }
        
        function openActionDetail(actionId) {
            if (longPressTimer) return;
            localStorage.setItem('wutree_current_action', actionId);
            window.location.href = 'wu-tree-v2-action-detail.html';
        }
        
        function formatDateForInput(date) { return date.toISOString().split('T')[0]; }
        
        function openCalendarModal() {
            calendarDate = new Date(selectedDate);
            renderCalendar();
            document.getElementById('calendarModal').classList.add('show');
        }
        
        function closeCalendarModal() { document.getElementById('calendarModal').classList.remove('show'); }
        
        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            
            const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
            const levelData = treeData[currentLevelId] || { intention: '', actions: [] };
            const taskDates = levelData.actions.map(a => a.dueDate).filter(Boolean);
            
            let html = `<div class="calendar-header">
                <div class="calendar-title">${monthNames[month]} ${year}</div>
                <div class="calendar-nav">
                    <button class="calendar-nav-btn" onclick="prevMonth()">‹</button>
                    <button class="calendar-nav-btn" onclick="nextMonth()">›</button>
                </div>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header">L</div><div class="calendar-day-header">M</div>
                <div class="calendar-day-header">M</div><div class="calendar-day-header">J</div>
                <div class="calendar-day-header">V</div><div class="calendar-day-header">S</div>
                <div class="calendar-day-header">D</div>`;
            
            const prevMonth2 = new Date(year, month, 0);
            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month" onclick="selectCalendarDate(${year}, ${month - 1}, ${prevMonth2.getDate() - i})">${prevMonth2.getDate() - i}</div>`;
            }
            
            const today = new Date();
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const isSelected = day === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear();
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasTasks = taskDates.includes(dateStr);
                html += `<div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${hasTasks ? 'has-tasks' : ''}" onclick="selectCalendarDate(${year}, ${month}, ${day})">${day}</div>`;
            }
            
            const remaining = 42 - (startDay + lastDay.getDate());
            for (let day = 1; day <= remaining; day++) {
                html += `<div class="calendar-day other-month" onclick="selectCalendarDate(${year}, ${month + 1}, ${day})">${day}</div>`;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function prevMonth() { calendarDate.setMonth(calendarDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { calendarDate.setMonth(calendarDate.getMonth() + 1); renderCalendar(); }
        
        function selectCalendarDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            closeCalendarModal();
            updateDateDisplay();
            renderContent();
        }
        
        function saveTree() {
            const projectId = localStorage.getItem('wutree_current_project');
            let projects = JSON.parse(localStorage.getItem('wutree_projects') || '[]');
            const projectIndex = projects.findIndex(p => p.id === projectId);
            if (projectIndex === -1) return;
            
            const subprojectIndex = projects[projectIndex].subprojects.findIndex(sp => sp.id === currentSubproject.id);
            if (subprojectIndex === -1) return;
            
            projects[projectIndex].subprojects[subprojectIndex].tree = treeData;
            localStorage.setItem('wutree_projects', JSON.stringify(projects));
        }
        
        function goBack() { window.location.href = 'wu-tree-v2-subproject-tree.html'; }
        function goToHome() { window.location.href = 'wu-tree-v2-home.html'; }
        function goToValues() { window.location.href = 'wu-tree-v2-values.html'; }
        function goToRoots() { window.location.href = 'wu-tree-v2-roots.html'; }
        function goToTasks() { window.location.href = 'wu-tree-v2-tasks.html'; }
        
        document.getElementById('actionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addAction();
        });
        
        init();
    </script>
</body>
</html>
