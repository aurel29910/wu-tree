<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        /* Pétales flottants */
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 25%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 55%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 70%; animation-duration: 15s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 85%; animation-duration: 17s; animation-delay: 5s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        /* Nuages */
        .cloud {
            position: absolute;
            color: white;
            font-size: 50px;
            opacity: 0.5;
            animation: float-cloud linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .cloud:nth-child(7) { top: 80px; animation-duration: 180s; }
        .cloud:nth-child(8) { top: 180px; animation-duration: 220s; animation-delay: -60s; font-size: 40px; }
        
        @keyframes float-cloud {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(470px); }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 15px 20px 10px;
            text-align: center;
            position: relative;
            z-index: 100;
        }
        
        .header-title {
            font-size: 26px;
            font-weight: 700;
            color: #333;
        }
        
        .header-subtitle {
            font-size: 12px;
            color: rgba(0,0,0,0.5);
            margin-top: 5px;
        }
        
        /* Content */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            height: calc(100% - 180px);
            overflow-y: auto;
            position: relative;
            z-index: 50;
        }
        
        /* Bubbles grid */
        .bubbles-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 10px;
        }
        
        /* Bulles flottantes */
        .bubble {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.1),
                inset 0 2px 10px rgba(255,255,255,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        
        .bubble:hover {
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.15),
                inset 0 2px 10px rgba(255,255,255,0.4);
        }
        
        .bubble:active {
            transform: scale(0.95) !important;
        }
        
        /* Animations flottantes organiques */
        .bubble:nth-child(1) { animation: float1 6s ease-in-out infinite; }
        .bubble:nth-child(2) { animation: float2 7s ease-in-out infinite; animation-delay: -1s; }
        .bubble:nth-child(3) { animation: float3 6.5s ease-in-out infinite; animation-delay: -2s; }
        .bubble:nth-child(4) { animation: float4 7.5s ease-in-out infinite; animation-delay: -0.5s; }
        .bubble:nth-child(5) { animation: float1 6.8s ease-in-out infinite; animation-delay: -3s; }
        .bubble:nth-child(6) { animation: float2 7.2s ease-in-out infinite; animation-delay: -1.5s; }
        .bubble:nth-child(7) { animation: float3 6.3s ease-in-out infinite; animation-delay: -2.5s; }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(8px, -12px) rotate(2deg); }
            50% { transform: translate(-5px, -8px) rotate(-1deg); }
            75% { transform: translate(10px, -15px) rotate(1deg); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, -10px) rotate(-2deg); }
            50% { transform: translate(6px, -18px) rotate(1deg); }
            75% { transform: translate(-8px, -6px) rotate(-1deg); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(6px, -15px) rotate(1deg); }
            50% { transform: translate(-8px, -10px) rotate(-2deg); }
            75% { transform: translate(4px, -8px) rotate(0deg); }
        }
        
        @keyframes float4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-6px, -8px) rotate(-1deg); }
            50% { transform: translate(10px, -14px) rotate(2deg); }
            75% { transform: translate(-4px, -12px) rotate(0deg); }
        }
        
        .bubble-emoji {
            font-size: 36px;
            margin-bottom: 5px;
        }
        
        .bubble-label {
            font-size: 9px;
            font-weight: 600;
            color: #333;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Effet de brillance */
        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 30%; height: 20%;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        /* Priority badge */
        .bubble-priority {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%;
            color: #333;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 165, 0, 0.4);
            border: 2px solid white;
        }
        
        .bubble-priority.hidden {
            display: none;
        }
        
        /* Badge compteur */
        .bubble-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            min-width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            border-radius: 10px;
            color: white;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            box-shadow: 0 2px 8px rgba(107, 78, 155, 0.4);
        }
        
        .bubble-badge.empty {
            display: none;
        }
        
        /* Edit mode */
        .edit-mode .bubble {
            animation: none !important;
            animation: shake 0.3s ease-in-out infinite !important;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
        }
        
        .edit-btn {
            position: absolute;
            top: 55px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            z-index: 100;
        }
        
        .edit-btn.active {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            color: white;
            border-color: transparent;
        }
        
        /* Arrows for reordering */
        .bubble-arrows {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
        }
        
        .edit-mode .bubble-arrows {
            display: flex;
        }
        
        .arrow-btn {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.8);
            border: 2px solid rgba(107, 78, 155, 0.3);
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .arrow-btn:active {
            background: #6B4E9B;
            color: white;
        }
        
        .bubble-delete {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #ff4444;
            border: 2px solid white;
            border-radius: 50%;
            font-size: 12px;
            color: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .edit-mode .bubble-delete {
            display: flex;
        }
        
        .bubble.add-bubble {
            border: 3px dashed rgba(107, 78, 155, 0.4);
            background: rgba(255,255,255,0.3);
        }
        
        .bubble.add-bubble .bubble-emoji {
            opacity: 0.6;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal {
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
        
        .modal-content {
            padding: 20px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            background: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Comfortaa', cursive;
        }
        
        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .emoji-option {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            cursor: pointer;
        }
        
        .emoji-option.selected {
            border-color: #6B4E9B;
            background: rgba(107, 78, 155, 0.2);
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.5);
            color: #333;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6B4E9B, #9B6B9B);
            color: white;
        }
        
        /* Quote */
        .quote-container {
            position: absolute;
            bottom: 90px;
            left: 30px;
            right: 30px;
            text-align: center;
            z-index: 50;
        }
        
        .quote-text {
            font-size: 11px;
            color: rgba(0,0,0,0.4);
            font-style: italic;
            line-height: 1.5;
        }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 90;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 16px;
            transition: all 0.3s;
        }
        
        .menu-item.active {
            background: rgba(255, 255, 255, 0.6);
        }
        
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Pétales -->
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <!-- Nuages -->
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <button class="edit-btn" id="editBtn" onclick="toggleEditMode()">Prioriser</button>
        
        <div class="header">
            <div class="header-title">🌳 Wu Tree</div>
            <div class="header-subtitle">Agis dans le flow</div>
        </div>
        
        <div class="content">
            <div class="bubbles-container" id="bubblesContainer">
                <!-- Rempli par JS -->
            </div>
        </div>
        
        <div class="quote-container">
            <div class="quote-text">
                « Le voyage de mille lieues<br>commence par un pas. »
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item" onclick="goToWellbeing()">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item active">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Arbre</div>
            </div>
            <div class="menu-item" onclick="goToTasks()">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
        
        <!-- Modal Ajouter Domaine -->
        <div class="modal-overlay" id="domainModal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">➕ Nouveau domaine</div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-content">
                    <div class="input-group">
                        <label class="input-label">Nom du domaine</label>
                        <input type="text" class="input-field" id="domainName" placeholder="Ex: Sport, Spiritualité...">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Emoji</label>
                        <div class="emoji-picker" id="emojiPicker"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveDomain()">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ========== STATE ==========
        let isEditMode = false;
        
        // ========== DOMAINES ==========
        const DEFAULT_DOMAINS = [
            { id: 'sante', emoji: '💪', name: 'Santé', order: 0 },
            { id: 'business', emoji: '💰', name: 'Business & Finance', order: 1 },
            { id: 'relations', emoji: '❤️', name: 'Relations', order: 2 },
            { id: 'connaissance', emoji: '📚', name: 'Connaissance', order: 3 },
            { id: 'creativite', emoji: '🎨', name: 'Créativité', order: 4 },
            { id: 'maison', emoji: '🏠', name: 'Maison', order: 5 },
            { id: 'voyages', emoji: '✈️', name: 'Voyages', order: 6 }
        ];
        
        function loadDomains() {
            let domains = JSON.parse(localStorage.getItem('wutree_domains') || 'null');
            
            if (!domains) {
                domains = DEFAULT_DOMAINS;
                localStorage.setItem('wutree_domains', JSON.stringify(domains));
            }
            
            return domains.sort((a, b) => a.order - b.order);
        }
        
        function saveDomains(domains) {
            localStorage.setItem('wutree_domains', JSON.stringify(domains));
        }
        
        function getTaskCountForDomain(domainId) {
            const tasks = JSON.parse(localStorage.getItem('wutree_tasks') || '[]');
            return tasks.filter(t => t.domain === domainId && !t.completed).length;
        }
        
        function renderBubbles() {
            const container = document.getElementById('bubblesContainer');
            const domains = loadDomains();
            
            let html = domains.map((domain, index) => {
                const taskCount = getTaskCountForDomain(domain.id);
                const badgeClass = taskCount === 0 ? 'bubble-badge empty' : 'bubble-badge';
                const priorityClass = index < 3 ? 'bubble-priority' : 'bubble-priority hidden';
                
                return `
                    <div class="bubble" data-id="${domain.id}" data-order="${domain.order}" onclick="handleBubbleClick('${domain.id}')">
                        <button class="bubble-delete" onclick="event.stopPropagation(); deleteDomain('${domain.id}')">×</button>
                        <div class="${priorityClass}">${index + 1}</div>
                        <div class="${badgeClass}">${taskCount}</div>
                        <div class="bubble-emoji">${domain.emoji}</div>
                        <div class="bubble-label">${domain.name}</div>
                        <div class="bubble-arrows">
                            <button class="arrow-btn" onclick="event.stopPropagation(); moveDomain('${domain.id}', -1)">↑</button>
                            <button class="arrow-btn" onclick="event.stopPropagation(); moveDomain('${domain.id}', 1)">↓</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add bubble for new domain
            html += `
                <div class="bubble add-bubble" onclick="openAddDomainModal()">
                    <div class="bubble-emoji">➕</div>
                    <div class="bubble-label">Ajouter</div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function handleBubbleClick(domainId) {
            if (isEditMode) return;
            openDomain(domainId);
        }
        
        function openDomain(domainId) {
            localStorage.setItem('wutree_current_domain', domainId);
            window.location.href = 'wu-tree-v2-domain.html';
        }
        
        // ========== EDIT MODE ==========
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editBtn');
            const container = document.getElementById('bubblesContainer');
            
            if (isEditMode) {
                btn.textContent = '✓ Terminé';
                btn.classList.add('active');
                container.classList.add('edit-mode');
            } else {
                btn.textContent = 'Prioriser';
                btn.classList.remove('active');
                container.classList.remove('edit-mode');
            }
        }
        
        function moveDomain(domainId, direction) {
            let domains = loadDomains();
            const currentIndex = domains.findIndex(d => d.id === domainId);
            const newIndex = currentIndex + direction;
            
            if (newIndex < 0 || newIndex >= domains.length) return;
            
            // Swap orders
            const temp = domains[currentIndex].order;
            domains[currentIndex].order = domains[newIndex].order;
            domains[newIndex].order = temp;
            
            saveDomains(domains);
            renderBubbles();
            
            // Re-apply edit mode class
            if (isEditMode) {
                document.getElementById('bubblesContainer').classList.add('edit-mode');
            }
        }
        
        // ========== ADD/DELETE DOMAINS ==========
        const DOMAIN_EMOJIS = ['🎯', '🧘', '🏃', '🎵', '🎨', '💻', '📱', '🌱', '⭐', '🔥', '🎓', '🏆', '💎', '🌍', '🧠', '💡'];
        
        function openAddDomainModal() {
            document.getElementById('domainName').value = '';
            setupEmojiPicker();
            document.getElementById('domainModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('domainModal').classList.remove('show');
        }
        
        function setupEmojiPicker() {
            const container = document.getElementById('emojiPicker');
            container.innerHTML = DOMAIN_EMOJIS.map((e, i) => 
                `<div class="emoji-option ${i === 0 ? 'selected' : ''}" onclick="selectEmoji(this)">${e}</div>`
            ).join('');
        }
        
        function selectEmoji(el) {
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        function saveDomain() {
            const name = document.getElementById('domainName').value.trim();
            const emoji = document.querySelector('.emoji-option.selected')?.textContent || '🎯';
            
            if (!name) {
                alert('Entre un nom pour le domaine !');
                return;
            }
            
            const domains = loadDomains();
            const maxOrder = Math.max(...domains.map(d => d.order), -1);
            
            // Generate unique ID
            const id = name.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '_')
                .substring(0, 20) + '_' + Date.now();
            
            domains.push({
                id,
                emoji,
                name,
                order: maxOrder + 1
            });
            
            saveDomains(domains);
            closeModal();
            renderBubbles();
        }
        
        function deleteDomain(domainId) {
            const domains = loadDomains();
            const domain = domains.find(d => d.id === domainId);
            
            if (!confirm(`Supprimer le domaine "${domain?.name}" ?\n\nCela ne supprimera pas les activités et objectifs liés.`)) {
                return;
            }
            
            const filtered = domains.filter(d => d.id !== domainId);
            
            // Reorder
            filtered.forEach((d, i) => d.order = i);
            
            saveDomains(filtered);
            renderBubbles();
            
            // Re-apply edit mode
            if (isEditMode) {
                document.getElementById('bubblesContainer').classList.add('edit-mode');
            }
        }
        
        // ========== NAVIGATION ==========
        function goToWellbeing() {
            window.location.href = 'wu-tree-v2-visualization.html';
        }
        
        function goToTasks() {
            window.location.href = 'wu-tree-v2-tasks.html';
        }
        
        // ========== INIT ==========
        renderBubbles();
    </script>
</body>
</html>
