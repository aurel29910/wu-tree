
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Bien-être</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        /* Pétales flottants */
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 25%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 55%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 70%; animation-duration: 15s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 85%; animation-duration: 17s; animation-delay: 5s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        /* Nuages */
        .cloud {
            position: absolute;
            color: white;
            font-size: 50px;
            opacity: 0.5;
            animation: float-cloud linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .cloud:nth-child(7) { top: 100px; animation-duration: 180s; }
        .cloud:nth-child(8) { top: 200px; animation-duration: 220s; animation-delay: -60s; font-size: 40px; }
        
        @keyframes float-cloud {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(470px); }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 10px 20px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        
        .back-btn {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #333;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        /* Bubbles container */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 200px);
            position: relative;
            z-index: 50;
        }
        
        .bubbles-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 30px;
        }
        
        /* Bulles flottantes */
        .bubble {
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.1),
                inset 0 2px 10px rgba(255,255,255,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        
        .bubble:hover {
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.15),
                inset 0 2px 10px rgba(255,255,255,0.4);
        }
        
        .bubble:active {
            transform: scale(0.95) !important;
        }
        
        /* Animation flottante organique */
        .bubble-1 {
            animation: float1 6s ease-in-out infinite;
        }
        
        .bubble-2 {
            animation: float2 7s ease-in-out infinite;
            animation-delay: -2s;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(8px, -12px) rotate(2deg); }
            50% { transform: translate(-5px, -8px) rotate(-1deg); }
            75% { transform: translate(10px, -15px) rotate(1deg); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, -10px) rotate(-2deg); }
            50% { transform: translate(6px, -18px) rotate(1deg); }
            75% { transform: translate(-8px, -6px) rotate(-1deg); }
        }
        
        .bubble-emoji {
            font-size: 45px;
            margin-bottom: 8px;
        }
        
        .bubble-label {
            font-size: 11px;
            font-weight: 600;
            color: #333;
            text-align: center;
            line-height: 1.3;
        }
        
        /* Effet de brillance */
        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 30%; height: 20%;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        /* Quote */
        .quote-container {
            position: absolute;
            bottom: 40px;
            left: 30px;
            right: 30px;
            text-align: center;
            z-index: 50;
        }
        
        .quote-text {
            font-size: 12px;
            color: rgba(0,0,0,0.4);
            font-style: italic;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Pétales -->
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <!-- Nuages -->
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">✨ Bien-être</div>
        </div>
        
        <div class="content">
            <div class="bubbles-container">
                <div class="bubble bubble-1" onclick="goTo('habits')">
                    <div class="bubble-emoji">🌱</div>
                    <div class="bubble-label">Nouvelles<br>habitudes</div>
                </div>
                
                <div class="bubble bubble-2" onclick="goTo('visualization')">
                    <div class="bubble-emoji">✨</div>
                    <div class="bubble-label">Visualisation<br>guidée</div>
                </div>
            </div>
        </div>
        
        <div class="quote-container">
            <div class="quote-text">
                « Prends soin de ton intérieur,<br>et l'extérieur suivra. »
            </div>
        </div>
    </div>
    
    <script>
        function goBack() {
            window.location.href = 'wu-tree-v2-home.html';
        }
        
        function goTo(page) {
            switch(page) {
                case 'habits':
                    window.location.href = 'wu-tree-v2-habits.html';
                    break;
                case 'visualization':
                    window.location.href = 'wu-tree-v2-visualization.html';
                    break;
            }
        }
    </script>
</body>
</html>
