<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Visualisation</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        /* Pétales flottants */
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 25%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 55%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 70%; animation-duration: 15s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 85%; animation-duration: 17s; animation-delay: 5s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        /* Nuages */
        .cloud {
            position: absolute;
            color: white;
            font-size: 50px;
            opacity: 0.5;
            animation: float-cloud linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .cloud:nth-child(7) { top: 100px; animation-duration: 180s; }
        .cloud:nth-child(8) { top: 200px; animation-duration: 220s; animation-delay: -60s; font-size: 40px; }
        
        @keyframes float-cloud {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(470px); }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 10px 20px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        
        .back-btn {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #333;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        /* Content */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 200px);
            position: relative;
            z-index: 50;
        }
        
        .bubbles-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 30px;
        }
        
        /* Bulles flottantes */
        .bubble {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.1),
                inset 0 2px 10px rgba(255,255,255,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        
        .bubble:hover {
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.15),
                inset 0 2px 10px rgba(255,255,255,0.4);
        }
        
        .bubble:active {
            transform: scale(0.95) !important;
        }
        
        /* Animation flottante organique */
        .bubble-1 {
            animation: float1 6s ease-in-out infinite;
        }
        
        .bubble-2 {
            animation: float2 7s ease-in-out infinite;
            animation-delay: -2s;
        }
        
        .bubble-3 {
            animation: float3 5.5s ease-in-out infinite;
            animation-delay: -1s;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(8px, -12px) rotate(2deg); }
            50% { transform: translate(-5px, -8px) rotate(-1deg); }
            75% { transform: translate(10px, -15px) rotate(1deg); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, -10px) rotate(-2deg); }
            50% { transform: translate(6px, -18px) rotate(1deg); }
            75% { transform: translate(-8px, -6px) rotate(-1deg); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(6px, -8px) rotate(1deg); }
            50% { transform: translate(-8px, -14px) rotate(-2deg); }
            75% { transform: translate(4px, -6px) rotate(0deg); }
        }
        
        .bubble-emoji {
            font-size: 38px;
            margin-bottom: 6px;
        }
        
        .bubble-label {
            font-size: 10px;
            font-weight: 600;
            color: #333;
            text-align: center;
            line-height: 1.3;
        }
        
        /* Effet de brillance */
        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 30%; height: 20%;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        /* Indicateur sur bulle Vision */
        .bubble-indicator {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: #6B4E9B;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }
        
        .bubble-indicator.empty {
            background: rgba(200, 100, 100, 0.8);
        }
        
        .bubble-indicator.done {
            background: #4CAF50;
        }
        
        /* Quote */
        .quote-container {
            position: absolute;
            bottom: 100px;
            left: 30px;
            right: 30px;
            text-align: center;
            z-index: 50;
        }
        
        .quote-text {
            font-size: 12px;
            color: rgba(0,0,0,0.4);
            font-style: italic;
            line-height: 1.5;
        }
        
        /* Connexion visuelle entre bulles */
        .connection-hint {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: rgba(0,0,0,0.4);
            padding: 0 40px;
            line-height: 1.5;
        }
        
        /* Bottom menu */
        .bottom-menu {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 100;
        }
        
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 16px; }
        .menu-item.active { background: rgba(255, 255, 255, 0.6); }
        .menu-icon { font-size: 24px; }
        .menu-label { font-size: 10px; color: rgba(0,0,0,0.6); font-weight: 500; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Pétales -->
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <!-- Nuages -->
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">✨ Visualisation</div>
        </div>
        
        <div class="content">
            <div class="bubbles-container">
                <div class="bubble bubble-1" onclick="goTo('vision')">
                    <div class="bubble-indicator" id="visionIndicator">!</div>
                    <div class="bubble-emoji">🔮</div>
                    <div class="bubble-label">Ma Vision</div>
                </div>
                
                <div class="bubble bubble-2" onclick="goTo('session')">
                    <div class="bubble-emoji">✨</div>
                    <div class="bubble-label">Session</div>
                </div>
                
                <div class="bubble bubble-3" onclick="goTo('progress')">
                    <div class="bubble-emoji">📊</div>
                    <div class="bubble-label">Progression</div>
                </div>
            </div>
            
            <div class="connection-hint">
                Écris ta vision → Visualise-la chaque jour → Suis ta progression
            </div>
        </div>
        
        <div class="quote-container">
            <div class="quote-text">
                « Vis depuis la fin,<br>comme si c'était déjà fait. »
            </div>
        </div>
        
        <div class="bottom-menu">
            <div class="menu-item active">
                <div class="menu-icon">🔮</div>
                <div class="menu-label">Vision</div>
            </div>
            <div class="menu-item" onclick="goBack()">
                <div class="menu-icon">🌳</div>
                <div class="menu-label">Home</div>
            </div>
            <div class="menu-item" onclick="goToTasks()">
                <div class="menu-icon">📋</div>
                <div class="menu-label">Aujourd'hui</div>
            </div>
        </div>
    </div>
    
    <script>
        // Check vision status
        function updateVisionIndicator() {
            const vision = JSON.parse(localStorage.getItem('wutree_vision') || 'null');
            const indicator = document.getElementById('visionIndicator');
            
            if (vision && vision.text) {
                indicator.classList.remove('empty');
                indicator.classList.add('done');
                indicator.textContent = '✓';
            } else {
                indicator.classList.add('empty');
                indicator.classList.remove('done');
                indicator.textContent = '!';
            }
        }
        
        function goTo(page) {
            switch(page) {
                case 'vision':
                    window.location.href = 'wu-tree-v2-vision.html';
                    break;
                case 'session':
                    window.location.href = 'wu-tree-v2-session.html';
                    break;
                case 'progress':
                    window.location.href = 'wu-tree-v2-progress.html';
                    break;
            }
        }
        
        function goBack() {
            window.location.href = 'wu-tree-v2-home.html';
        }
        
        function goToTasks() {
            window.location.href = 'wu-tree-v2-tasks.html';
        }
        
        // Init
        updateVisionIndicator();
    </script>
</body>
</html>
