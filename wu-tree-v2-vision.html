<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wu Tree - Ma Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%; max-width: 390px;
            height: 844px; max-height: 95vh;
            background: linear-gradient(135deg, #B4E1D4 0%, #D4B4E1 50%, #F5C5D4 100%);
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }
        
        /* Pétales flottants */
        .petal {
            position: absolute;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(255, 105, 180, 0.6));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; width: 8px; }
        .petal:nth-child(2) { left: 25%; animation-duration: 14s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 55%; animation-duration: 13s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 70%; animation-duration: 15s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 85%; animation-duration: 17s; animation-delay: 5s; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }
        
        /* Nuages */
        .cloud {
            position: absolute;
            color: white;
            font-size: 50px;
            opacity: 0.5;
            animation: float-cloud linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .cloud:nth-child(7) { top: 100px; animation-duration: 180s; }
        .cloud:nth-child(8) { top: 200px; animation-duration: 220s; animation-delay: -60s; font-size: 40px; }
        
        @keyframes float-cloud {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(470px); }
        }
        
        .status-bar {
            height: 47px;
            padding: 15px 25px 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.6);
            position: relative;
            z-index: 100;
        }
        
        .header {
            padding: 10px 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        
        .back-btn {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #333;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        
        .content {
            position: relative;
            z-index: 50;
            padding: 0 20px;
            height: calc(100% - 130px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* ========== ÉCRAN ÉCRITURE ========== */
        .write-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        
        .write-screen.active {
            display: flex;
        }
        
        .write-intro {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .write-emoji {
            font-size: 45px;
            margin-bottom: 10px;
        }
        
        .write-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .write-hint {
            font-size: 11px;
            color: rgba(0,0,0,0.5);
            line-height: 1.5;
        }
        
        .vision-textarea {
            flex: 1;
            min-height: 280px;
            background: rgba(255,255,255,0.6);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 20px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            color: #333;
            line-height: 1.7;
            resize: none;
            outline: none;
        }
        
        .vision-textarea::placeholder {
            color: rgba(0,0,0,0.35);
        }
        
        .vision-textarea:focus {
            border-color: #6B4E9B;
        }
        
        .write-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-bottom: 15px;
        }
        
        .action-btn {
            flex: 1;
            padding: 15px;
            border-radius: 20px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .action-btn.secondary {
            background: rgba(255,255,255,0.5);
            color: #333;
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, #6B4E9B 0%, #9B6B9B 100%);
            color: white;
        }
        
        .action-btn:active {
            transform: scale(0.97);
        }
        
        /* ========== ÉCRAN VISION EXISTANTE ========== */
        .view-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        
        .view-screen.active {
            display: flex;
        }
        
        .vision-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 15px;
            flex: 1;
            overflow-y: auto;
        }
        
        .vision-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .vision-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .vision-card-date {
            font-size: 10px;
            color: rgba(0,0,0,0.4);
        }
        
        .vision-card-text {
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .view-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 0;
        }
        
        .view-actions .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        /* Quote */
        .quote-hint {
            text-align: center;
            font-size: 11px;
            color: rgba(0,0,0,0.4);
            font-style: italic;
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Pétales -->
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <!-- Nuages -->
        <div class="cloud">☁️</div><div class="cloud">☁️</div>
        
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">🔮 Ma Vision</div>
        </div>
        
        <div class="content">
            <!-- Écran écriture -->
            <div class="write-screen" id="writeScreen">
                <div class="write-intro">
                    <div class="write-emoji">🔮</div>
                    <div class="write-title">Décris ta vie idéale</div>
                    <div class="write-hint">
                        Écris au présent, comme si tu y étais déjà.<br>
                        Ce que tu ressens, ce que tu fais, où tu es.
                    </div>
                </div>
                
                <textarea class="vision-textarea" id="visionTextarea" placeholder="Je me réveille dans mon appartement à Chiang Mai. La lumière du matin passe à travers les rideaux. Je me sens calme, libre, vivant.

Après mon café, j'ouvre mes charts et je prends mes positions du jour. Aucun stress, juste de la clarté.

Puis direction le gym pour ma session de Muay Thai..."></textarea>
                
                <div class="quote-hint">
                    « Vis depuis la fin, comme si c'était déjà fait. »
                </div>
                
                <div class="write-actions">
                    <button class="action-btn secondary" onclick="cancelWriting()">Annuler</button>
                    <button class="action-btn primary" onclick="saveVision()">Enregistrer</button>
                </div>
            </div>
            
            <!-- Écran vision existante -->
            <div class="view-screen" id="viewScreen">
                <div class="vision-card">
                    <div class="vision-card-header">
                        <div class="vision-card-title">✨ Ma vision</div>
                        <div class="vision-card-date" id="visionDate"></div>
                    </div>
                    <div class="vision-card-text" id="visionText"></div>
                </div>
                
                <div class="view-actions">
                    <button class="action-btn secondary" onclick="editVision()">✏️ Modifier</button>
                    <button class="action-btn primary" onclick="goToSession()">✨ Commencer une session</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ========== STATE ==========
        let visionData = JSON.parse(localStorage.getItem('wutree_vision') || 'null');
        
        // ========== INIT ==========
        function init() {
            if (visionData && visionData.text) {
                showViewScreen();
            } else {
                showWriteScreen();
            }
        }
        
        // ========== SCREENS ==========
        function showWriteScreen() {
            document.getElementById('writeScreen').classList.add('active');
            document.getElementById('viewScreen').classList.remove('active');
            document.getElementById('visionTextarea').value = visionData?.text || '';
        }
        
        function showViewScreen() {
            document.getElementById('writeScreen').classList.remove('active');
            document.getElementById('viewScreen').classList.add('active');
            renderVision();
        }
        
        // ========== ACTIONS ==========
        function cancelWriting() {
            if (visionData && visionData.text) {
                showViewScreen();
            } else {
                goBack();
            }
        }
        
        function saveVision() {
            const text = document.getElementById('visionTextarea').value.trim();
            if (!text) {
                alert('Écris ta vision avant d\'enregistrer');
                return;
            }
            
            visionData = {
                text: text,
                createdAt: visionData?.createdAt || new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            
            localStorage.setItem('wutree_vision', JSON.stringify(visionData));
            showViewScreen();
        }
        
        function editVision() {
            showWriteScreen();
        }
        
        function renderVision() {
            if (!visionData) return;
            
            document.getElementById('visionText').textContent = visionData.text;
            
            const date = new Date(visionData.updatedAt || visionData.createdAt);
            document.getElementById('visionDate').textContent = date.toLocaleDateString('fr-FR');
        }
        
        // ========== NAVIGATION ==========
        function goBack() {
            window.location.href = 'wu-tree-v2-visualization.html';
        }
        
        function goToSession() {
            window.location.href = 'wu-tree-v2-session.html';
        }
        
        // ========== START ==========
        init();
    </script>
</body>
</html>
